pression_ratio R^2 = {r2:.4f}\"\n        )\n\n        plot_heatmap(\n            ece_after_grids[strategy],\n            bits_list,\n            sparsity_list,\n            f\"{key} [{strategy}]: ECE after refit\",\n            f\"{key}_{strategy}_ece_heatmap_after.png\",\n        )\n\n# ---------------- Cross-strategy summary ----------------\nprint(\n    \"\\n=== Average calibration_recovery_ratio by strategy (across all datasets/configs) ===\"\n)\nfor s in STRATEGIES:\n    avg_crr = (\n        float(np.nanmean(all_crr_by_strategy[s]))\n        if all_crr_by_strategy[s]\n        else float(\"nan\")\n    )\n    print(f\"  {s}: {avg_crr:.4f}\")\n\nplt.figure(figsize=(7, 5))\nds_keys = [spec[\"key\"] for spec in dataset_specs]\nwidth = 0.25\nx = np.arange(len(ds_keys))\ncolors = {\n    \"global\": \"tab:blue\",\n    \"sensitivity_variance\": \"tab:orange\",\n    \"depth_based\": \"tab:green\",\n}\nfor i, s in enumerate(STRATEGIES):\n    means = []\n    for key in ds_keys:\n        vals = [\n            r[\"calibration_recovery_ratio\"]\n            for r in experiment_data[\"compression_granularity\"][key][\"strategies\"][s][\n                \"compression_results\"\n            ]\n            if not np.isnan(r[\"calibration_recovery_ratio\"])\n        ]\n        means.append(np.mean(vals) if vals else np.nan)\n    plt.bar(x + (i - 1) * width, means, width, label=s, color=colors[s])\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.xticks(x, ds_keys)\nplt.ylabel(\"Mean calibration_recovery_ratio\")\nplt.title(\"CRR by compression allocation strategy (global vs. per-layer)\")\nplt.legend()\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"calibration_recovery_ratio_by_strategy.png\"))\nplt.close()\n\nplt.figure(figsize=(7, 5))\nfor i, s in enumerate(STRATEGIES):\n    means = []\n    for key in ds_keys:\n        vals = [\n            r[\"ece_after\"]\n            for r in experiment_data[\"compression_granularity\"][key][\"strategies\"][s][\n                \"compression_results\"\n            ]\n        ]\n        means.append(np.mean(vals))\n    plt.bar(x + (i - 1) * width, means, width, label=s, color=colors[s])\nplt.xticks(x, ds_keys)\nplt.ylabel(\"Mean ECE after temperature refit\")\nplt.title(\"Post-refit ECE by compression allocation strategy\")\nplt.legend()\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"ece_after_by_strategy.png\"))\nplt.close()\n\n# ---------------- Save experiment data ----------------\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy and plots to working directory.\")\n", "import os\nimport copy\nimport time\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# --- Compatibility shim: newer pyarrow removed PyExtensionType, which the\n# `datasets` library references at class-definition time in features.py.\n# We never use Array2D/3D/4D/5D features, so aliasing to ExtensionType is\n# safe (only needed to satisfy the class statement, not instantiation).\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nABLATION_KEY = \"finetune_vs_temp_refit\"\n\n\ndef new_dataset_record():\n    return {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    }\n\n\nexperiment_data = {\n    ABLATION_KEY: {\n        \"mnist\": new_dataset_record(),\n        \"fashion_mnist\": new_dataset_record(),\n        \"adult_income\": new_dataset_record(),\n    }\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration utilities ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        T = torch.exp(logT)\n        loss = nll(logits / T, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    return torch.exp(logT).item()\n\n\ndef eval_model(m, X, y, n_classes, T=1.0):\n    m.eval()\n    with torch.no_grad():\n        logits = m(X)\n        probs = F.softmax(logits / T, dim=1)\n        acc = (probs.argmax(1) == y).float().mean().item()\n        ece = compute_ece(probs, y)\n        brier = compute_brier(probs, y, n_classes)\n    return acc, ece, brier, logits\n\n\n# ---------------- Compression ----------------\ndef get_compress_layers(m):\n    return [layer for layer in m.modules() if isinstance(layer, (nn.Linear, nn.Conv2d))]\n\n\ndef quantize_layer_weight(w, bits):\n    levels = 2**bits\n    wmin, wmax = w.min(), w.max()\n    scale = (wmax - wmin) / (levels - 1) if levels > 1 else (wmax - wmin)\n    if scale.item() == 0:\n        return w\n    q = torch.clamp(torch.round((w - wmin) / scale), 0, levels - 1)\n    return q * scale + wmin\n\n\ndef prune_layer_weight(w, sparsity):\n    if sparsity <= 0:\n        return w\n    flat = w.abs().flatten()\n    k = int(sparsity * flat.numel())\n    if k <= 0:\n        return w\n    threshold = torch.kthvalue(flat, k).values\n    mask = w.abs() > threshold\n    return w * mask.float()\n\n\ndef compress_model(model, bits=32, sparsity=0.0):\n    cm = copy.deepcopy(model)\n    with torch.no_grad():\n        for layer in get_compress_layers(cm):\n            w = layer.weight.data\n            if sparsity > 0:\n                w = prune_layer_weight(w, sparsity)\n            if bits < 32:\n                w = quantize_layer_weight(w, bits)\n            layer.weight.data.copy_(w)\n    return cm\n\n\ndef r_squared(x, y, coeffs):\n    yhat = np.polyval(coeffs, x)\n    ss_res = np.sum((y - yhat) ** 2)\n    ss_tot = np.sum((y - np.mean(y)) ** 2)\n    return 1 - ss_res / ss_tot if ss_tot > 0 else float(\"nan\")\n\n\ndef plot_heatmap(grid, bits_list, sparsity_list, title, fname):\n    plt.figure(figsize=(6, 5))\n    plt.imshow(grid, aspect=\"auto\", cmap=\"viridis\")\n    plt.colorbar(label=\"ECE\")\n    plt.xticks(range(len(sparsity_list)), [str(s) for s in sparsity_list])\n    plt.yticks(range(len(bits_list)), [str(b) for b in bits_list])\n    plt.xlabel(\"Sparsity\")\n    plt.ylabel(\"Bit-width (32=no quant)\")\n    plt.title(title)\n    for i in range(len(bits_list)):\n        for j in range(len(sparsity_list)):\n            plt.text(\n                j,\n                i,\n                f\"{grid[i, j]:.3f}\",\n                ha=\"center\",\n                va=\"center\",\n                color=\"white\",\n                fontsize=7,\n            )\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, fname))\n    plt.close()\n\n\n# ---------------- Fine-tune recovery (ablation) ----------------\ndef finetune_compressed(cm, X_tr, y_tr, epochs=2, lr=1e-4, batch_size=64):\n    optimizer = torch.optim.Adam(cm.parameters(), lr=lr)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    cm.train()\n    for epoch in range(epochs):\n        perm = torch.randperm(n_train)\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            loss = criterion(cm(xb), yb)\n            loss.backward()\n            optimizer.step()\n    return cm\n\n\n# ---------------- Training loop ----------------\ndef train_loop(model, X_tr, y_tr, X_val, y_val, epochs, batch_size, dataset_key):\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    for epoch in range(epochs):\n        model.train()\n        perm = torch.randperm(n_train)\n        total_loss, correct = 0.0, 0\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            logits = model(xb)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * xb.size(0)\n            correct += (logits.argmax(1) == yb).sum().item()\n        train_loss = total_loss / n_train\n        train_acc = correct / n_train\n\n        model.eval()\n        with torch.no_grad():\n            val_logits = model(X_val)\n            val_loss = criterion(val_logits, y_val).item()\n            val_acc = (val_logits.argmax(1) == y_val).float().mean().item()\n\n        print(\n            f\"[{dataset_key}] Epoch {epoch}: validation_loss = {val_loss:.4f}, val_acc = {val_acc:.4f}\"\n        )\n        rec = experiment_data[ABLATION_KEY][dataset_key]\n        rec[\"losses\"][\"train\"].append({\"epoch\": epoch, \"loss\": train_loss})\n        rec[\"losses\"][\"val\"].append({\"epoch\": epoch, \"loss\": val_loss})\n        rec[\"metrics\"][\"train\"].append(\n            {\"epoch\": epoch, \"acc\": train_acc, \"calibration_recovery_ratio\": np.nan}\n        )\n        rec[\"metrics\"][\"val\"].append(\n            {\"epoch\": epoch, \"acc\": val_acc, \"calibration_recovery_ratio\": np.nan}\n        )\n\n\n# ---------------- Main experiment per dataset ----------------\ndataset_specs = [\n    {\"key\": \"mnist\", \"type\": \"image\", \"hf_name\": \"mnist\", \"n_classes\": 10, \"epochs\": 5},\n    {\n        \"key\": \"fashion_mnist\",\n        \"type\": \"image\",\n        \"hf_name\": \"fashion_mnist\",\n        \"n_classes\": 10,\n        \"epochs\": 5,\n    },\n    {\"key\": \"adult_income\", \"type\": \"tabular\", \"n_classes\": 2, \"epochs\": 12},\n]\n\nbits_list = [32, 8, 4, 2]\nsparsity_list = [0.0, 0.3, 0.5, 0.7, 0.9, 0.95]\nFT_EPOCHS = 2\nFT_LR = 1e-4\n\nall_crr = []\nall_ft_crr = []\ntemp_reg_data = {\"ratio\": [], \"T\": [], \"dataset\": []}\n\nfor spec in dataset_specs:\n    key = spec[\"key\"]\n    ds_rec = experiment_data[ABLATION_KEY][key]\n    print(f\"\\n===== Dataset: {key} =====\")\n    if spec[\"type\"] == \"image\":\n        X, y = load_image_dataset(spec[\"hf_name\"], n_samples=6000, seed=0)\n    else:\n        X, y = load_tabular_dataset(n_samples=6000, seed=0)\n\n    X_tr, y_tr, X_val, y_val, X_te, y_te = make_splits(X, y, seed=0)\n    X_tr_t = torch.tensor(X_tr).to(device)\n    y_tr_t = torch.tensor(y_tr, dtype=torch.long).to(device)\n    X_val_t = torch.tensor(X_val).to(device)\n    y_val_t = torch.tensor(y_val, dtype=torch.long).to(device)\n    X_te_t = torch.tensor(X_te).to(device)\n    y_te_t = torch.tensor(y_te, dtype=torch.long).to(device)\n\n    n_classes = spec[\"n_classes\"]\n    if spec[\"type\"] == \"image\":\n        model = TinyCNN(n_classes).to(device)\n    else:\n        model = TinyMLP(X.shape[1], n_classes).to(device)\n    n_params = sum(p.numel() for p in model.parameters())\n    print(f\"[{key}] model has {n_params} parameters\")\n\n    train_loop(model, X_tr_t, y_tr_t, X_val_t, y_val_t, spec[\"epochs\"], 64, key)\n\n    # baseline calibration\n    base_acc, base_ece, base_brier, base_test_logits = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=1.0\n    )\n    _, _, _, base_val_logits = eval_model(model, X_val_t, y_val_t, n_classes, T=1.0)\n    base_T = fit_temperature(base_val_logits.detach(), y_val_t)\n    base_acc_ref, base_ece_ref, base_brier_ref, _ = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=base_T\n    )\n    print(\n        f\"[{key}] Original: acc={base_acc:.4f} ECE={base_ece:.4f} | +refit(T={base_T:.3f}): \"\n        f\"acc={base_acc_ref:.4f} ECE={base_ece_ref:.4f}\"\n    )\n\n    with torch.no_grad():\n        ds_rec[\"predictions\"] = F.softmax(base_test_logits, dim=1).cpu().numpy()\n    ds_rec[\"ground_truth\"] = y_te_t.cpu().numpy()\n\n    ece_before_grid = np.zeros((len(bits_list), len(sparsity_list)))\n    ece_after_grid = np.zeros((len(bits_list), len(sparsity_list)))\n    ece_ft_grid = np.zeros((len(bits_list), len(sparsity_list)))\n\n    for bi, bits in enumerate(bits_list):\n        for si, sp in enumerate(sparsity_list):\n            compression_ratio = (bits / 32.0) * (1 - sp)\n            if bits == 32 and sp == 0.0:\n                acc_b, ece_b, brier_b = base_acc, base_ece, base_brier\n                T_opt = base_T\n                acc_a, ece_a, brier_a = base_acc_ref, base_ece_ref, base_brier_ref\n                ece_static = base_ece_ref\n                temp_fit_time = 0.0\n                cm = copy.deepcopy(model)  # fresh copy, safe to fine-tune below\n            else:\n                cm = compress_model(model, bits=bits, sparsity=sp).to(device)\n                acc_b, ece_b, brier_b, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=1.0\n                )\n                _, _, _, val_logits = eval_model(cm, X_val_t, y_val_t, n_classes, T=1.0)\n                t0 = time.perf_counter()\n                T_opt = fit_temperature(val_logits.detach(), y_val_t)\n                temp_fit_time = time.perf_counter() - t0\n                acc_a, ece_a, brier_a, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=T_opt\n                )\n                _, ece_static, _, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=base_T\n                )\n\n            denom = ece_b - base_ece_ref\n            crr = (ece_b - ece_a) / denom if abs(denom) > 1e-8 else np.nan\n            if not np.isnan(crr):\n                all_crr.append(crr)\n\n            # --- Ablation: fine-tune compressed weights instead of temperature refit ---\n            t0 = time.perf_counter()\n            ft_model = finetune_compressed(\n                cm, X_tr_t, y_tr_t, epochs=FT_EPOCHS, lr=FT_LR, batch_size=64\n            )\n            finetune_time = time.perf_counter() - t0\n            acc_ft, ece_ft, brier_ft, _ = eval_model(\n                ft_model, X_te_t, y_te_t, n_classes, T=1.0\n            )\n            ft_crr = (ece_b - ece_ft) / denom if abs(denom) > 1e-8 else np.nan\n            if not np.isnan(ft_crr):\n                all_ft_crr.append(ft_crr)\n\n            temp_reg_data[\"ratio\"].append(compression_ratio)\n            temp_reg_data[\"T\"].append(T_opt)\n            temp_reg_data[\"dataset\"].append(key)\n\n            ece_before_grid[bi, si] = ece_b\n            ece_after_grid[bi, si] = ece_a\n            ece_ft_grid[bi, si] = ece_ft\n\n            ds_rec[\"compression_results\"].append(\n                {\n                    \"bits\": bits,\n                    \"sparsity\": sp,\n                    \"compression_ratio\": compression_ratio,\n                    \"acc_before\": acc_b,\n                    \"ece_before\": ece_b,\n                    \"brier_before\": brier_b,\n                    \"acc_after\": acc_a,\n                    \"ece_after\": ece_a,\n                    \"brier_after\": brier_a,\n                    \"ece_after_static_T\": ece_static,\n                    \"temperature\": T_opt,\n                    \"calibration_recovery_ratio\": crr,\n                    \"temp_fit_time_s\": temp_fit_time,\n                    \"acc_ft\": acc_ft,\n                    \"ece_ft\": ece_ft,\n                    \"brier_ft\": brier_ft,\n                    \"finetune_recovery_ratio\": ft_crr,\n                    \"finetune_time_s\": finetune_time,\n                }\n            )\n            print(\n                f\"[{key}] bits={bits} sparsity={sp}: ECE_before={ece_b:.4f} | \"\n                f\"T-refit: ECE={ece_a:.4f} CRR={crr:.3f} ({temp_fit_time*1000:.1f}ms) | \"\n                f\"FT: acc={acc_ft:.4f} ECE={ece_ft:.4f} FT-CRR={ft_crr:.3f} ({finetune_time*1000:.1f}ms)\"\n            )\n\n    # temperature vs compression_ratio regression\n    ratios = np.array([r[\"compression_ratio\"] for r in ds_rec[\"compression_results\"]])\n    temps = np.array([r[\"temperature\"] for r in ds_rec[\"compression_results\"]])\n    coeffs = np.polyfit(ratios, temps, 1)\n    r2 = r_squared(ratios, temps, coeffs)\n    ds_rec[\"temp_regression_r2\"] = r2\n    print(f\"[{key}] Temperature ~ compression_ratio regression R^2 = {r2:.4f}\")\n\n    plot_heatmap(\n        ece_before_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE before refit\",\n        f\"{key}_ece_heatmap_before.png\",\n    )\n    plot_heatmap(\n        ece_after_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE after temperature refit\",\n        f\"{key}_ece_heatmap_after.png\",\n    )\n    plot_heatmap(\n        ece_ft_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE after fine-tune recovery\",\n        f\"{key}_ece_heatmap_finetune.png\",\n    )\n\navg_crr = float(np.nanmean(all_crr))\navg_ft_crr = float(np.nanmean(all_ft_crr))\nprint(\n    f\"\\n=== Overall average calibration_recovery_ratio (temperature refit): {avg_crr:.4f} ===\"\n)\nprint(\n    f\"=== Overall average finetune_recovery_ratio (weight fine-tune): {avg_ft_crr:.4f} ===\"\n)\n\n# ---------------- Cross-dataset plots ----------------\nds_keys = [s[\"key\"] for s in dataset_specs]\n\ncrr_means, ft_crr_means = [], []\ntemp_time_means, ft_time_means = [], []\nfor key in ds_keys:\n    results = experiment_data[ABLATION_KEY][key][\"compression_results\"]\n    crr_vals = [\n        r[\"calibration_recovery_ratio\"]\n        for r in results\n        if not np.isnan(r[\"calibration_recovery_ratio\"])\n    ]\n    ft_vals = [\n        r[\"finetune_recovery_ratio\"]\n        for r in results\n        if not np.isnan(r[\"finetune_recovery_ratio\"])\n    ]\n    crr_means.append(np.mean(crr_vals))\n    ft_crr_means.append(np.mean(ft_vals))\n    temp_time_means.append(np.mean([r[\"temp_fit_time_s\"] for r in results]))\n    ft_time_means.append(np.mean([r[\"finetune_time_s\"] for r in results]))\n\nx = np.arange(len(ds_keys))\nwidth = 0.35\nplt.figure()\nplt.bar(x - width / 2, crr_means, width, label=\"Temperature refit CRR\")\nplt.bar(x + width / 2, ft_crr_means, width, label=\"Fine-tune recovery ratio\")\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.xticks(x, ds_keys)\nplt.ylabel(\"Mean recovery ratio\")\nplt.title(\"Calibration recovery: temperature refit vs weight fine-tuning\")\nplt.legend()\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"calibration_recovery_ratio_by_dataset.png\"))\nplt.close()\n\nplt.figure()\nplt.bar(x - width / 2, temp_time_means, width, label=\"Temperature fit time (s)\")\nplt.bar(x + width / 2, ft_time_means, width, label=\"Fine-tune time (s)\")\nplt.xticks(x, ds_keys)\nplt.ylabel(\"Mean wall-clock time (s)\")\nplt.title(\"Compute cost: temperature refit vs weight fine-tuning\")\nplt.legend()\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"recovery_compute_cost_by_dataset.png\"))\nplt.close()\n\nplt.figure()\ncolors = {\n    \"mnist\": \"tab:blue\",\n    \"fashion_mnist\": \"tab:orange\",\n    \"adult_income\": \"tab:green\",\n}\nfor key in ds_keys:\n    idx = [i for i, d in enumerate(temp_reg_data[\"dataset\"]) if d == key]\n    ratios = np.array(temp_reg_data[\"ratio\"])[idx]\n    temps = np.array(temp_reg_data[\"T\"])[idx]\n    plt.scatter(ratios, temps, label=key, color=colors[key], alpha=0.7)\nplt.xlabel(\"Compression ratio (bits/32 * (1-sparsity))\")\nplt.ylabel(\"Optimal temperature\")\nplt.title(\"Optimal temperature vs compression ratio\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_vs_compression_ratio.png\"))\nplt.close()\n\n# ---------------- Save experiment data ----------------\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy and plots to working directory.\")\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 0\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os\nimport copy\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# --- Compatibility shim: newer pyarrow removed PyExtensionType, which the\n# `datasets` library references at class-definition time in features.py.\n# We never use Array2D/3D/4D/5D features, so aliasing to ExtensionType is\n# safe (only needed to satisfy the class statement, not instantiation).\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nORDERS = [\"prune_then_quantize\", \"quantize_then_prune\"]\nDATASET_KEYS = [\"mnist\", \"fashion_mnist\", \"adult_income\"]\n\n\ndef blank_dataset_entry():\n    return {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    }\n\n\nexperiment_data = {\n    order: {k: blank_dataset_entry() for k in DATASET_KEYS} for order in ORDERS\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration utilities ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        T = torch.exp(logT)\n        loss = nll(logits / T, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    # Clamp to avoid numerically degenerate T -> 0 / T -> inf solutions that\n    # arise on near-constant/degenerate logits (e.g. collapsed compressed models)\n    # and blow up downstream ECE/CRR values.\n    with torch.no_grad():\n        logT.clamp_(np.log(0.05), np.log(20.0))\n    return torch.exp(logT).item()\n\n\ndef eval_model(m, X, y, n_classes, T=1.0):\n    m.eval()\n    with torch.no_grad():\n        logits = m(X)\n        probs = F.softmax(logits / T, dim=1)\n        acc = (probs.argmax(1) == y).float().mean().item()\n        ece = compute_ece(probs, y)\n        brier = compute_brier(probs, y, n_classes)\n    return acc, ece, brier, logits\n\n\n# ---------------- Compression ----------------\ndef get_compress_layers(m):\n    return [layer for layer in m.modules() if isinstance(layer, (nn.Linear, nn.Conv2d))]\n\n\ndef quantize_layer_weight(w, bits):\n    levels = 2**bits\n    wmin, wmax = w.min(), w.max()\n    scale = (wmax - wmin) / (levels - 1) if levels > 1 else (wmax - wmin)\n    if scale.item() == 0:\n        return w\n    q = torch.clamp(torch.round((w - wmin) / scale), 0, levels - 1)\n    return q * scale + wmin\n\n\ndef prune_layer_weight(w, sparsity):\n    if sparsity <= 0:\n        return w\n    flat = w.abs().flatten()\n    k = int(sparsity * flat.numel())\n    if k <= 0:\n        return w\n    threshold = torch.kthvalue(flat, k).values\n    mask = w.abs() > threshold\n    return w * mask.float()\n\n\ndef compress_model(model, bits=32, sparsity=0.0, order=\"prune_then_quantize\"):\n    cm = copy.deepcopy(model)\n    with torch.no_grad():\n        for layer in get_compress_layers(cm):\n            w = layer.weight.data\n            if order == \"prune_then_quantize\":\n                if sparsity > 0:\n                    w = prune_layer_weight(w, sparsity)\n                if bits < 32:\n                    w = quantize_layer_weight(w, bits)\n            else:  # quantize_then_prune\n                if bits < 32:\n                    w = quantize_layer_weight(w, bits)\n                if sparsity > 0:\n                    w = prune_layer_weight(w, sparsity)\n            layer.weight.data.copy_(w)\n    return cm\n\n\ndef r_squared(x, y, coeffs):\n    yhat = np.polyval(coeffs, x)\n    ss_res = np.sum((y - yhat) ** 2)\n    ss_tot = np.sum((y - np.mean(y)) ** 2)\n    return 1 - ss_res / ss_tot if ss_tot > 0 else float(\"nan\")\n\n\ndef plot_heatmap(grid, bits_list, sparsity_list, title, fname):\n    plt.figure(figsize=(6, 5))\n    plt.imshow(grid, aspect=\"auto\", cmap=\"viridis\")\n    plt.colorbar(label=\"ECE\")\n    plt.xticks(range(len(sparsity_list)), [str(s) for s in sparsity_list])\n    plt.yticks(range(len(bits_list)), [str(b) for b in bits_list])\n    plt.xlabel(\"Sparsity\")\n    plt.ylabel(\"Bit-width (32=no quant)\")\n    plt.title(title)\n    for i in range(len(bits_list)):\n        for j in range(len(sparsity_list)):\n            plt.text(\n                j,\n                i,\n                f\"{grid[i, j]:.3f}\",\n                ha=\"center\",\n                va=\"center\",\n                color=\"white\",\n                fontsize=7,\n            )\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, fname))\n    plt.close()\n\n\n# ---------------- Training loop ----------------\ndef train_loop(model, X_tr, y_tr, X_val, y_val, epochs, batch_size, dataset_key):\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    losses_train, losses_val, metrics_train, metrics_val = [], [], [], []\n    for epoch in range(epochs):\n        model.train()\n        perm = torch.randperm(n_train)\n        total_loss, correct = 0.0, 0\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            logits = model(xb)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * xb.size(0)\n            correct += (logits.argmax(1) == yb).sum().item()\n        train_loss = total_loss / n_train\n        train_acc = correct / n_train\n\n        model.eval()\n        with torch.no_grad():\n            val_logits = model(X_val)\n            val_loss = criterion(val_logits, y_val).item()\n            val_acc = (val_logits.argmax(1) == y_val).float().mean().item()\n\n        print(\n            f\"[{dataset_key}] Epoch {epoch}: validation_loss = {val_loss:.4f}, val_acc = {val_acc:.4f}\"\n        )\n        losses_train.append({\"epoch\": epoch, \"loss\": train_loss})\n        losses_val.append({\"epoch\": epoch, \"loss\": val_loss})\n        # temperature_recovery_ratio is only defined per compression configuration\n        # (post-training), so it is not applicable during the training epochs.\n        metrics_train.append(\n            {\"epoch\": epoch, \"acc\": train_acc, \"temperature_recovery_ratio\": np.nan}\n        )\n        metrics_val.append(\n            {\"epoch\": epoch, \"acc\": val_acc, \"temperature_recovery_ratio\": np.nan}\n        )\n    return losses_train, losses_val, metrics_train, metrics_val\n\n\n# ---------------- Main experiment per dataset ----------------\ndataset_specs = [\n    {\"key\": \"mnist\", \"type\": \"image\", \"hf_name\": \"mnist\", \"n_classes\": 10, \"epochs\": 5},\n    {\n        \"key\": \"fashion_mnist\",\n        \"type\": \"image\",\n        \"hf_name\": \"fashion_mnist\",\n        \"n_classes\": 10,\n        \"epochs\": 5,\n    },\n    {\"key\": \"adult_income\", \"type\": \"tabular\", \"n_classes\": 2, \"epochs\": 12},\n]\n\nbits_list = [32, 8, 4, 2]\nsparsity_list = [0.0, 0.3, 0.5, 0.7, 0.9, 0.95]\n\nall_trr = {order: [] for order in ORDERS}\ntemp_reg_data = {order: {\"ratio\": [], \"T\": [], \"dataset\": []} for order in ORDERS}\n\nfor spec in dataset_specs:\n    key = spec[\"key\"]\n    print(f\"\\n===== Dataset: {key} =====\")\n    if spec[\"type\"] == \"image\":\n        X, y = load_image_dataset(spec[\"hf_name\"], n_samples=6000, seed=0)\n    else:\n        X, y = load_tabular_dataset(n_samples=6000, seed=0)\n\n    X_tr, y_tr, X_val, y_val, X_te, y_te = make_splits(X, y, seed=0)\n    X_tr_t = torch.tensor(X_tr).to(device)\n    y_tr_t = torch.tensor(y_tr, dtype=torch.long).to(device)\n    X_val_t = torch.tensor(X_val).to(device)\n    y_val_t = torch.tensor(y_val, dtype=torch.long).to(device)\n    X_te_t = torch.tensor(X_te).to(device)\n    y_te_t = torch.tensor(y_te, dtype=torch.long).to(device)\n\n    n_classes = spec[\"n_classes\"]\n    if spec[\"type\"] == \"image\":\n        model = TinyCNN(n_classes).to(device)\n    else:\n        model = TinyMLP(X.shape[1], n_classes).to(device)\n    n_params = sum(p.numel() for p in model.parameters())\n    print(f\"[{key}] model has {n_params} parameters\")\n\n    # Train once; compression order does not affect training.\n    losses_train, losses_val, metrics_train, metrics_val = train_loop(\n        model, X_tr_t, y_tr_t, X_val_t, y_val_t, spec[\"epochs\"], 64, key\n    )\n\n    # baseline calibration (uncompressed, same regardless of order)\n    base_acc, base_ece, base_brier, base_test_logits = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=1.0\n    )\n    _, _, _, base_val_logits = eval_model(model, X_val_t, y_val_t, n_classes, T=1.0)\n    base_T = fit_temperature(base_val_logits.detach(), y_val_t)\n    base_acc_ref, base_ece_ref, base_brier_ref, _ = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=base_T\n    )\n    print(\n        f\"[{key}] Original: acc={base_acc:.4f} ECE={base_ece:.4f} | +refit(T={base_T:.3f}): \"\n        f\"acc={base_acc_ref:.4f} ECE={base_ece_ref:.4f}\"\n    )\n    base_predictions = F.softmax(base_test_logits, dim=1).detach().cpu().numpy()\n    base_gt = y_te_t.cpu().numpy()\n\n    for order in ORDERS:\n        entry = experiment_data[order][key]\n        entry[\"losses\"][\"train\"] = copy.deepcopy(losses_train)\n        entry[\"losses\"][\"val\"] = copy.deepcopy(losses_val)\n        entry[\"metrics\"][\"train\"] = copy.deepcopy(metrics_train)\n        entry[\"metrics\"][\"val\"] = copy.deepcopy(metrics_val)\n        entry[\"predictions\"] = base_predictions\n        entry[\"ground_truth\"] = base_gt\n\n        ece_before_grid = np.zeros((len(bits_list), len(sparsity_list)))\n        ece_after_grid = np.zeros((len(bits_list), len(sparsity_list)))\n\n        for bi, bits in enumerate(bits_list):\n            for si, sp in enumerate(sparsity_list):\n                compression_ratio = (bits / 32.0) * (1 - sp)\n                if bits == 32 and sp == 0.0:\n                    acc_b, ece_b, brier_b = base_acc, base_ece, base_brier\n                    T_opt = base_T\n                    acc_a, ece_a, brier_a = base_acc_ref, base_ece_ref, base_brier_ref\n                    ece_static = base_ece_ref\n                else:\n                    cm = compress_model(model, bits=bits, sparsity=sp, order=order).to(\n                        device\n                    )\n                    acc_b, ece_b, brier_b, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=1.0\n                    )\n                    _, _, _, val_logits = eval_model(\n                        cm, X_val_t, y_val_t, n_classes, T=1.0\n                    )\n                    T_opt = fit_temperature(val_logits.detach(), y_val_t)\n                    acc_a, ece_a, brier_a, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=T_opt\n                    )\n                    _, ece_static, _, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=base_T\n                    )\n\n                # temperature_recovery_ratio: (ECE_compressed_uncalibrated - ECE_compressed_refit)\n                # / ECE_original_uncalibrated. The reference (denominator) must be the ORIGINAL\n                # uncompressed model's uncalibrated ECE (base_ece), not the refit baseline ECE\n                # (base_ece_ref) -- using the latter created a trivial identity at the no-compression\n                # config (always 1.000) and unstable/negative values elsewhere.\n                denom = base_ece\n                trr = (ece_b - ece_a) / denom if abs(denom) > 1e-8 else np.nan\n                if not np.isnan(trr):\n                    all_trr[order].append(trr)\n\n                temp_reg_data[order][\"ratio\"].append(compression_ratio)\n                temp_reg_data[order][\"T\"].append(T_opt)\n                temp_reg_data[order][\"dataset\"].append(key)\n\n                ece_before_grid[bi, si] = ece_b\n                ece_after_grid[bi, si] = ece_a\n\n                entry[\"compression_results\"].append(\n                    {\n                        \"bits\": bits,\n                        \"sparsity\": sp,\n                        \"compression_ratio\": compression_ratio,\n                        \"order\": order,\n                        \"acc_before\": acc_b,\n                        \"ece_before\": ece_b,\n                        \"brier_before\": brier_b,\n                        \"acc_after\": acc_a,\n                        \"ece_after\": ece_a,\n                        \"brier_after\": brier_a,\n                        \"ece_after_static_T\": ece_static,\n                        \"temperature\": T_opt,\n                        \"temperature_recovery_ratio\": trr,\n                    }\n                )\n                print(\n                    f\"[{key}|{order}] bits={bits} sparsity={sp}: acc={acc_a:.4f} ECE_before={ece_b:.4f} \"\n                    f\"ECE_after={ece_a:.4f} T={T_opt:.3f} TRR={trr:.3f}\"\n                )\n\n        ratios = np.array(\n            [r[\"compression_ratio\"] for r in entry[\"compression_results\"]]\n        )\n        temps = np.array([r[\"temperature\"] for r in entry[\"compression_results\"]])\n        coeffs = np.polyfit(ratios, temps, 1)\n        r2 = r_squared(ratios, temps, coeffs)\n        entry[\"temp_regression_r2\"] = r2\n        print(\n            f\"[{key}|{order}] Temperature ~ compression_ratio regression R^2 = {r2:.4f}\"\n        )\n\n        plot_heatmap(\n            ece_before_grid,\n            bits_list,\n            sparsity_list,\n            f\"{key} ({order}): ECE before refit\",\n            f\"{key}_{order}_ece_heatmap_before.png\",\n        )\n        plot_heatmap(\n            ece_after_grid,\n            bits_list,\n            sparsity_list,\n            f\"{key} ({order}): ECE after refit\",\n            f\"{key}_{order}_ece_heatmap_after.png\",\n        )\n\nfor order in ORDERS:\n    avg_trr = float(np.nanmean(all_trr[order]))\n    print(\n        f\"\\n=== [{order}] Overall average temperature_recovery_ratio: {avg_trr:.4f} ===\"\n    )\n\n# ---------------- Cross-order / cross-dataset comparison plots ----------------\nplt.figure()\nwidth = 0.35\nx = np.arange(len(DATASET_KEYS))\nfor oi, order in enumerate(ORDERS):\n    trr_means = []\n    for key in DATASET_KEYS:\n        vals = [\n            r[\"temperature_recovery_ratio\"]\n            for r in experiment_data[order][key][\"compression_results\"]\n            if not np.isnan(r[\"temperature_recovery_ratio\"])\n        ]\n        trr_means.append(np.mean(vals))\n    plt.bar(x + (oi - 0.5) * width, trr_means, width, label=order)\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.xticks(x, DATASET_KEYS)\nplt.ylabel(\"Mean temperature_recovery_ratio\")\nplt.title(\"TRR by compression order: prune-then-quantize vs quantize-then-prune\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_recovery_ratio_by_order.png\"))\nplt.close()\n\nplt.figure()\ncolors = {\"prune_then_quantize\": \"tab:blue\", \"quantize_then_prune\": \"tab:red\"}\nfor order in ORDERS:\n    ratios = np.array(temp_reg_data[order][\"ratio\"])\n    temps = np.array(temp_reg_data[order][\"T\"])\n    plt.scatter(ratios, temps, label=order, color=colors[order], alpha=0.5)\nplt.xlabel(\"Compression ratio (bits/32 * (1-sparsity))\")\nplt.ylabel(\"Optimal temperature\")\nplt.title(\"Optimal temperature vs compression ratio, by order\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_vs_compression_ratio_by_order.png\"))\nplt.close()\n\n# Direct per-config ECE difference between orderings, averaged across datasets\ndiff_before = np.zeros((len(bits_list), len(sparsity_list)))\ndiff_after = np.zeros((len(bits_list), len(sparsity_list)))\nfor bi, bits in enumerate(bits_list):\n    for si, sp in enumerate(sparsity_list):\n        deltas_b, deltas_a = [], []\n        for key in DATASET_KEYS:\n            r_pq = next(\n                r\n                for r in experiment_data[\"prune_then_quantize\"][key][\n                    \"compression_results\"\n                ]\n                if r[\"bits\"] == bits and r[\"sparsity\"] == sp\n            )\n            r_qp = next(\n                r\n                for r in experiment_data[\"quantize_then_prune\"][key][\n                    \"compression_results\"\n                ]\n                if r[\"bits\"] == bits and r[\"sparsity\"] == sp\n            )\n            deltas_b.append(r_qp[\"ece_before\"] - r_pq[\"ece_before\"])\n            deltas_a.append(r_qp[\"ece_after\"] - r_pq[\"ece_after\"])\n        diff_before[bi, si] = np.mean(deltas_b)\n        diff_after[bi, si] = np.mean(deltas_a)\n\nplot_heatmap(\n    diff_before,\n    bits_list,\n    sparsity_list,\n    \"ECE(quantize-then-prune) - ECE(prune-then-quantize), before refit\",\n    \"order_diff_ece_before_heatmap.png\",\n)\nplot_heatmap(\n    diff_after,\n    bits_list,\n    sparsity_list,\n    \"ECE(quantize-then-prune) - ECE(prune-then-quantize), after refit\",\n    \"order_diff_ece_after_heatmap.png\",\n)\n\n# ---------------- Save experiment data ----------------\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy and plots to working directory.\")\n", "# Set random seed\nimport random\nimport numpy as np\nimport torch\n\nseed = 1\nrandom.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)\nif torch.cuda.is_available():\n    torch.cuda.manual_seed(seed)\n\nimport os\nimport copy\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# --- Compatibility shim: newer pyarrow removed PyExtensionType, which the\n# `datasets` library references at class-definition time in features.py.\n# We never use Array2D/3D/4D/5D features, so aliasing to ExtensionType is\n# safe (only needed to satisfy the class statement, not instantiation).\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nORDERS = [\"prune_then_quantize\", \"quantize_then_prune\"]\nDATASET_KEYS = [\"mnist\", \"fashion_mnist\", \"adult_income\"]\n\n\ndef blank_dataset_entry():\n    return {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    }\n\n\nexperiment_data = {\n    order: {k: blank_dataset_entry() for k in DATASET_KEYS} for order in ORDERS\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration utilities ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        T = torch.exp(logT)\n        loss = nll(logits / T, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    # Clamp to avoid numerically degenerate T -> 0 / T -> inf solutions that\n    # arise on near-constant/degenerate logits (e.g. collapsed compressed models)\n    # and blow up downstream ECE/CRR values.\n    with torch.no_grad():\n        logT.clamp_(np.log(0.05), np.log(20.0))\n    return torch.exp(logT).item()\n\n\ndef eval_model(m, X, y, n_classes, T=1.0):\n    m.eval()\n    with torch.no_grad():\n        logits = m(X)\n        probs = F.softmax(logits / T, dim=1)\n        acc = (probs.argmax(1) == y).float().mean().item()\n        ece = compute_ece(probs, y)\n        brier = compute_brier(probs, y, n_classes)\n    return acc, ece, brier, logits\n\n\n# ---------------- Compression ----------------\ndef get_compress_layers(m):\n    return [layer for layer in m.modules() if isinstance(layer, (nn.Linear, nn.Conv2d))]\n\n\ndef quantize_layer_weight(w, bits):\n    levels = 2**bits\n    wmin, wmax = w.min(), w.max()\n    scale = (wmax - wmin) / (levels - 1) if levels > 1 else (wmax - wmin)\n    if scale.item() == 0:\n        return w\n    q = torch.clamp(torch.round((w - wmin) / scale), 0, levels - 1)\n    return q * scale + wmin\n\n\ndef prune_layer_weight(w, sparsity):\n    if sparsity <= 0:\n        return w\n    flat = w.abs().flatten()\n    k = int(sparsity * flat.numel())\n    if k <= 0:\n        return w\n    threshold = torch.kthvalue(flat, k).values\n    mask = w.abs() > threshold\n    return w * mask.float()\n\n\ndef compress_model(model, bits=32, sparsity=0.0, order=\"prune_then_quantize\"):\n    cm = copy.deepcopy(model)\n    with torch.no_grad():\n        for layer in get_compress_layers(cm):\n            w = layer.weight.data\n            if order == \"prune_then_quantize\":\n                if sparsity > 0:\n                    w = prune_layer_weight(w, sparsity)\n                if bits < 32:\n                    w = quantize_layer_weight(w, bits)\n            else:  # quantize_then_prune\n                if bits < 32:\n                    w = quantize_layer_weight(w, bits)\n                if sparsity > 0:\n                    w = prune_layer_weight(w, sparsity)\n            layer.weight.data.copy_(w)\n    return cm\n\n\ndef r_squared(x, y, coeffs):\n    yhat = np.polyval(coeffs, x)\n    ss_res = np.sum((y - yhat) ** 2)\n    ss_tot = np.sum((y - np.mean(y)) ** 2)\n    return 1 - ss_res / ss_tot if ss_tot > 0 else float(\"nan\")\n\n\ndef plot_heatmap(grid, bits_list, sparsity_list, title, fname):\n    plt.figure(figsize=(6, 5))\n    plt.imshow(grid, aspect=\"auto\", cmap=\"viridis\")\n    plt.colorbar(label=\"ECE\")\n    plt.xticks(range(len(sparsity_list)), [str(s) for s in sparsity_list])\n    plt.yticks(range(len(bits_list)), [str(b) for b in bits_list])\n    plt.xlabel(\"Sparsity\")\n    plt.ylabel(\"Bit-width (32=no quant)\")\n    plt.title(title)\n    for i in range(len(bits_list)):\n        for j in range(len(sparsity_list)):\n            plt.text(\n                j,\n                i,\n                f\"{grid[i, j]:.3f}\",\n                ha=\"center\",\n                va=\"center\",\n                color=\"white\",\n                fontsize=7,\n            )\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, fname))\n    plt.close()\n\n\n# ---------------- Training loop ----------------\ndef train_loop(model, X_tr, y_tr, X_val, y_val, epochs, batch_size, dataset_key):\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    losses_train, losses_val, metrics_train, metrics_val = [], [], [], []\n    for epoch in range(epochs):\n        model.train()\n        perm = torch.randperm(n_train)\n        total_loss, correct = 0.0, 0\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            logits = model(xb)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * xb.size(0)\n            correct += (logits.argmax(1) == yb).sum().item()\n        train_loss = total_loss / n_train\n        train_acc = correct / n_train\n\n        model.eval()\n        with torch.no_grad():\n            val_logits = model(X_val)\n            val_loss = criterion(val_logits, y_val).item()\n            val_acc = (val_logits.argmax(1) == y_val).float().mean().item()\n\n        print(\n            f\"[{dataset_key}] Epoch {epoch}: validation_loss = {val_loss:.4f}, val_acc = {val_acc:.4f}\"\n        )\n        losses_train.append({\"epoch\": epoch, \"loss\": train_loss})\n        losses_val.append({\"epoch\": epoch, \"loss\": val_loss})\n        # temperature_recovery_ratio is only defined per compression configuration\n        # (post-training), so it is not applicable during the training epochs.\n        metrics_train.append(\n            {\"epoch\": epoch, \"acc\": train_acc, \"temperature_recovery_ratio\": np.nan}\n        )\n        metrics_val.append(\n            {\"epoch\": epoch, \"acc\": val_acc, \"temperature_recovery_ratio\": np.nan}\n        )\n    return losses_train, losses_val, metrics_train, metrics_val\n\n\n# ---------------- Main experiment per dataset ----------------\ndataset_specs = [\n    {\"key\": \"mnist\", \"type\": \"image\", \"hf_name\": \"mnist\", \"n_classes\": 10, \"epochs\": 5},\n    {\n        \"key\": \"fashion_mnist\",\n        \"type\": \"image\",\n        \"hf_name\": \"fashion_mnist\",\n        \"n_classes\": 10,\n        \"epochs\": 5,\n    },\n    {\"key\": \"adult_income\", \"type\": \"tabular\", \"n_classes\": 2, \"epochs\": 12},\n]\n\nbits_list = [32, 8, 4, 2]\nsparsity_list = [0.0, 0.3, 0.5, 0.7, 0.9, 0.95]\n\nall_trr = {order: [] for order in ORDERS}\ntemp_reg_data = {order: {\"ratio\": [], \"T\": [], \"dataset\": []} for order in ORDERS}\n\nfor spec in dataset_specs:\n    key = spec[\"key\"]\n    print(f\"\\n===== Dataset: {key} =====\")\n    if spec[\"type\"] == \"image\":\n        X, y = load_image_dataset(spec[\"hf_name\"], n_samples=6000, seed=0)\n    else:\n        X, y = load_tabular_dataset(n_samples=6000, seed=0)\n\n    X_tr, y_tr, X_val, y_val, X_te, y_te = make_splits(X, y, seed=0)\n    X_tr_t = torch.tensor(X_tr).to(device)\n    y_tr_t = torch.tensor(y_tr, dtype=torch.long).to(device)\n    X_val_t = torch.tensor(X_val).to(device)\n    y_val_t = torch.tensor(y_val, dtype=torch.long).to(device)\n    X_te_t = torch.tensor(X_te).to(device)\n    y_te_t = torch.tensor(y_te, dtype=torch.long).to(device)\n\n    n_classes = spec[\"n_classes\"]\n    if spec[\"type\"] == \"image\":\n        model = TinyCNN(n_classes).to(device)\n    else:\n        model = TinyMLP(X.shape[1], n_classes).to(device)\n    n_params = sum(p.numel() for p in model.parameters())\n    print(f\"[{key}] model has {n_params} parameters\")\n\n    # Train once; compression order does not affect training.\n    losses_train, losses_val, metrics_train, metrics_val = train_loop(\n        model, X_tr_t, y_tr_t, X_val_t, y_val_t, spec[\"epochs\"], 64, key\n    )\n\n    # baseline calibration (uncompressed, same regardless of order)\n    base_acc, base_ece, base_brier, base_test_logits = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=1.0\n    )\n    _, _, _, base_val_logits = eval_model(model, X_val_t, y_val_t, n_classes, T=1.0)\n    base_T = fit_temperature(base_val_logits.detach(), y_val_t)\n    base_acc_ref, base_ece_ref, base_brier_ref, _ = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=base_T\n    )\n    print(\n        f\"[{key}] Original: acc={base_acc:.4f} ECE={base_ece:.4f} | +refit(T={base_T:.3f}): \"\n        f\"acc={base_acc_ref:.4f} ECE={base_ece_ref:.4f}\"\n    )\n    base_predictions = F.softmax(base_test_logits, dim=1).detach().cpu().numpy()\n    base_gt = y_te_t.cpu().numpy()\n\n    for order in ORDERS:\n        entry = experiment_data[order][key]\n        entry[\"losses\"][\"train\"] = copy.deepcopy(losses_train)\n        entry[\"losses\"][\"val\"] = copy.deepcopy(losses_val)\n        entry[\"metrics\"][\"train\"] = copy.deepcopy(metrics_train)\n        entry[\"metrics\"][\"val\"] = copy.deepcopy(metrics_val)\n        entry[\"predictions\"] = base_predictions\n        entry[\"ground_truth\"] = base_gt\n\n        ece_before_grid = np.zeros((len(bits_list), len(sparsity_list)))\n        ece_after_grid = np.zeros((len(bits_list), len(sparsity_list)))\n\n        for bi, bits in enumerate(bits_list):\n            for si, sp in enumerate(sparsity_list):\n                compression_ratio = (bits / 32.0) * (1 - sp)\n                if bits == 32 and sp == 0.0:\n                    acc_b, ece_b, brier_b = base_acc, base_ece, base_brier\n                    T_opt = base_T\n                    acc_a, ece_a, brier_a = base_acc_ref, base_ece_ref, base_brier_ref\n                    ece_static = base_ece_ref\n                else:\n                    cm = compress_model(model, bits=bits, sparsity=sp, order=order).to(\n                        device\n                    )\n                    acc_b, ece_b, brier_b, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=1.0\n                    )\n                    _, _, _, val_logits = eval_model(\n                        cm, X_val_t, y_val_t, n_classes, T=1.0\n                    )\n                    T_opt = fit_temperature(val_logits.detach(), y_val_t)\n                    acc_a, ece_a, brier_a, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=T_opt\n                    )\n                    _, ece_static, _, _ = eval_model(\n                        cm, X_te_t, y_te_t, n_classes, T=base_T\n                    )\n\n                # temperature_recovery_ratio: (ECE_compressed_uncalibrated - ECE_compressed_refit)\n                # / ECE_original_uncalibrated. The reference (denominator) must be the ORIGINAL\n                # uncompressed model's uncalibrated ECE (base_ece), not the refit baseline ECE\n                # (base_ece_ref) -- using the latter created a trivial identity at the no-compression\n                # config (always 1.000) and unstable/negative values elsewhere.\n                denom = base_ece\n                trr = (ece_b - ece_a) / denom if abs(denom) > 1e-8 else np.nan\n                if not np.isnan(trr):\n                    all_trr[order].append(trr)\n\n                temp_reg_data[order][\"ratio\"].append(compression_ratio)\n                temp_reg_data[order][\"T\"].append(T_opt)\n                temp_reg_data[order][\"dataset\"].append(key)\n\n                ece_before_grid[bi, si] = ece_b\n                ece_after_grid[bi, si] = ece_a\n\n                entry[\"compression_results\"].append(\n                    {\n                        \"bits\": bits,\n                        \"sparsity\": sp,\n                        \"compression_ratio\": compression_ratio,\n                        \"order\": order,\n                        \"acc_before\": acc_b,\n                        \"ece_before\": ece_b,\n                        \"brier_before\": brier_b,\n                        \"acc_after\": acc_a,\n                        \"ece_after\": ece_a,\n                        \"brier_after\": brier_a,\n                        \"ece_after_static_T\": ece_static,\n                        \"temperature\": T_opt,\n                        \"temperature_recovery_ratio\": trr,\n                    }\n                )\n                print(\n                    f\"[{key}|{order}] bits={bits} sparsity={sp}: acc={acc_a:.4f} ECE_before={ece_b:.4f} \"\n                    f\"ECE_after={ece_a:.4f} T={T_opt:.3f} TRR={trr:.3f}\"\n                )\n\n        ratios = np.array(\n            [r[\"compression_ratio\"] for r in entry[\"compression_results\"]]\n        )\n        temps = np.array([r[\"temperature\"] for r in entry[\"compression_results\"]])\n        coeffs = np.polyfit(ratios, temps, 1)\n        r2 = r_squared(ratios, temps, coeffs)\n        entry[\"temp_regression_r2\"] = r2\n        print(\n            f\"[{key}|{order}] Temperature ~ compression_ratio regression R^2 = {r2:.4f}\"\n        )\n\n        plot_heatmap(\n            ece_before_grid,\n            bits_list,\n            sparsity_list,\n            f\"{key} ({order}): ECE before refit\",\n            f\"{key}_{order}_ece_heatmap_before.png\",\n        )\n        plot_heatmap(\n            ece_after_grid,\n            bits_list,\n            sparsity_list,\n            f\"{key} ({order}): ECE after refit\",\n            f\"{key}_{order}_ece_heatmap_after.png\",\n        )\n\nfor order in ORDERS:\n    avg_trr = float(np.nanmean(all_trr[order]))\n    print(\n        f\"\\n=== [{order}] Overall average temperature_recovery_ratio: {avg_trr:.4f} ===\"\n    )\n\n# ---------------- Cross-order / cross-dataset comparison plots ----------------\nplt.figure()\nwidth = 0.35\nx = np.arange(len(DATASET_KEYS))\nfor oi, order in enumerate(ORDERS):\n    trr_means = []\n    for key in DATASET_KEYS:\n        vals = [\n            r[\"temperature_recovery_ratio\"]\n            for r in experiment_data[order][key][\"compression_results\"]\n            if not np.isnan(r[\"temperature_recovery_ratio\"])\n        ]\n        trr_means.append(np.mean(vals))\n    plt.bar(x + (oi - 0.5) * width, trr_means, width, label=order)\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.xticks(x, DATASET_KEYS)\nplt.ylabel(\"Mean temperature_recovery_ratio\")\nplt.title(\"TRR by compression order: prune-then-quantize vs quantize-then-prune\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_recovery_ratio_by_order.png\"))\nplt.clo s (time limit is 30 minutes).']"], "analysis": ["", "Bug in histogram_binning implementation: The fit_histogram_binning and\napply_histogram_binning functions use mismatched binning schemes.\nfit_histogram_binning uses all n_bins+1 boundaries to define n_bins bins, but\napply_histogram_binning uses only bin_boundaries[1:-1] (n_bins-1 boundaries)\nwith np.digitize, creating a different binning structure. This causes boundary\nhandling mismatches: (1) confidence values exactly at 1/15 are included in fit\nbin 0 but excluded in apply region 0, and (2) confidence values at 14/15 are\nexcluded in fit bin 14 but included in apply region 14. This could contribute to\nthe poor calibration results (many negative CRR values, histogram_binning making\nECE worse). Fix: Use the full boundaries in apply_histogram_binning by changing\n`np.digitize(conf_np, bin_boundaries[1:-1])` to `np.digitize(conf_np,\nbin_boundaries[:-1])` to match the fit function's binning scheme.", "The code includes degenerate compression configurations where models collapse\n(e.g., MNIST 95% sparsity: acc=0.1089, Adult Income 95% sparsity: acc=0.5044)\nbut still computes Calibration Recovery Ratio (CRR), producing invalid negative\nvalues (-2.035, -3.149, -3.428) and temperature fitting failures (T=0.000).\nThese broken cases skew the reported averages (prune_then_quantize avg\nCRR=-0.1538). Fix: Filter out configurations where accuracy drops below ~30% or\nwhere temperature optimization fails (T near 0), flagging them as degenerate\nseparately. This aligns with the researchers' own risk factor acknowledgment\nabout excluding cases where calibration metrics become uninformative.", "", "", "The calibration_recovery_ratio (CRR) metric is poorly designed and produces\nunreliable results. The formula `crr = (ece_b - ece_a) / (ece_b - base_ece_ref)`\nhas critical edge cases: (1) When the denominator is very small (ece_b \u2248\nbase_ece_ref), CRR becomes unstable and can swing wildly; (2) When temperature\nrefit degrades calibration (ece_a > ece_b), CRR turns negative; (3) The\ndepth_based strategy shows an anomalous average CRR of 3.6 vs 0.48 and 0.16 for\nother strategies, suggesting metric instability. Additionally, the temperature\nregression R\u00b2 values are low (most < 0.5), contradicting the hypothesis that\noptimal temperature scales monotonically with compression ratio. Fix: (1)\nExclude or flag CRR values where |ece_b - base_ece_ref| is very small (e.g., <\n0.01); (2) Use a bounded or absolute metric like mean calibration error\nimprovement rather than a ratio; (3) Report negative CRR cases separately as\n'temperature refit degraded calibration' rather than including them in averages.", "Major bug in ablation study design: Fine-tuned models are evaluated with T=1.0,\nbut temperature-refitted models get their temperature optimized on validation\ndata. This makes fine-tuning appear much worse than it should be. After fine-\ntuning on the training set, temperature should be refitted on validation data\nbefore test evaluation, just like the temperature-refit baseline. Currently, the\ncomparison is unfair because fine-tuning optimizes for accuracy loss (not\ncalibration), and without post-finetune temperature adjustment, the resulting\nmiscalibration isn't corrected. This explains why the average\nfinetune_recovery_ratio is -38.1462 (strongly negative), indicating the fine-\ntuning approach systematically worsens calibration without its corresponding\nfair recovery step. Fix: Apply temperature refitting to fine-tuned models on\nvalidation data before evaluating on test set, mirroring the temperature-refit\ncomparison baseline.", "", ""], "exc_type": [null, null, null, null, null, null, null, null, null], "exc_info": [null, null, null, null, null, null, null, null, null], "exc_stack": [null, null, null, null, null, null, null, null, null], "exp_name": "0-run", "metrics": [{"metric_names": [{"metric_name": "train loss", "lower_is_better": true, "description": "Traini
