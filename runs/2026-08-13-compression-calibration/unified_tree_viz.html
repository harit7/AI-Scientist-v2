      if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
          let lastModified = '';

          // Check for file changes every second
          setInterval(async () => {
              try {
                  const response = await fetch(window.location.href, { method: 'HEAD' });
                  // get a timestamp that shows when the file was last changed
                  const currentModified = response.headers.get('last-modified');

                  if (lastModified && lastModified !== currentModified) {
                      window.location.reload();
                  }

                  lastModified = currentModified;
              } catch (e) {
                  console.error('Error checking for updates:', e);
              }
          }, 1000);
      }

      const bgCol = "#FFFFFF";
const accentCol = "#1a439e";

hljs.initHighlightingOnLoad();

// Function to update background color globally
function updateBackgroundColor(color) {
  // Update the JS variable
  window.bgColCurrent = color;

  // Update body background
  document.body.style.backgroundColor = color;

  // Update canvas container background
  const canvasContainer = document.getElementById('canvas-container');
  if (canvasContainer) {
    canvasContainer.style.backgroundColor = color;
  }
}

// Store tree data for each stage
const stageData = {
  Stage_1: null,
  Stage_2: null,
  Stage_3: null,
  Stage_4: null
};

// Keep track of current selected stage
let currentStage = null;
let currentSketch = null;
let availableStages = [];

// Class definitions for nodes and edges
class Node {
  constructor(x, y, id, isRoot = false) {
    this.x = x;
    this.y = y;
    this.id = id;
    this.visible = isRoot; // Only root nodes are visible initially
    this.appearProgress = 0;
    this.popEffect = 0;
    this.selected = false;
    this.isRootNode = isRoot;
  }

  update() {
    if (this.visible) {
      // Handle the main appearance animation
      if (this.appearProgress < 1) {
        this.appearProgress += 0.06;

        // When we reach full size, trigger the pop effect
        if (this.appearProgress >= 1) {
          this.appearProgress = 1; // Cap at 1
          this.popEffect = 1; // Start the pop effect
        }
      }

      // Handle the pop effect animation
      if (this.popEffect > 0) {
        this.popEffect -= 0.15; // Control how quickly it shrinks back
        if (this.popEffect < 0) this.popEffect = 0; // Don't go negative
      }
    }
  }

  startAnimation() {
    this.visible = true;
  }

  color() {
    if (this.selected) {
      return accentCol; // Use the global accent color variable for selected node
    }
    return '#4263eb'; // Default blue color
  }

  render(p5) {
    if (this.visible) {
      const popBonus = this.popEffect * 0.1;
      const nodeScale = p5.map(this.appearProgress, 0, 1, 0, 1) + popBonus;
      const alpha = p5.map(this.appearProgress, 0, 1, 0, 255);

      p5.push();
      p5.translate(this.x, this.y);

      // Shadow effect
      p5.noStroke();
      p5.rectMode(p5.CENTER);

      for (let i = 1; i <= 4; i++) {
        p5.fill(0, 0, 0, alpha * 0.06);
        p5.rect(i, i, 30 * nodeScale, 30 * nodeScale, 10);
      }

      // Main square - use node's color with alpha
      let nodeColor = p5.color(this.color());
      nodeColor.setAlpha(alpha);
      p5.fill(nodeColor);
      p5.rect(0, 0, 30 * nodeScale, 30 * nodeScale, 10);

      // Draw checkmark icon if the node is selected
      if (this.selected && this.appearProgress >= 1) {
        p5.stroke(255);
        p5.strokeWeight(2 * nodeScale);
        p5.noFill();
        // Draw checkmark
        p5.beginShape();
        p5.vertex(-8, 0);
        p5.vertex(-3, 5);
        p5.vertex(8, -6);
        p5.endShape();
      }

      p5.pop();
    }
  }

  isMouseOver(p5) {
    return this.visible &&
           p5.mouseX > this.x - 15 &&
           p5.mouseX < this.x + 15 &&
           p5.mouseY > this.y - 15 &&
           p5.mouseY < this.y + 15;
  }

  // Connect this node to a child node
  child(childNode) {
    // Create an edge from this node to the child
    let isLeft = childNode.x < this.x;
    let isRight = childNode.x > this.x;
    let edge = new Edge(this, childNode, isLeft, isRight);
    return edge;
  }
}

class Edge {
  constructor(parent, child, isLeft, isRight) {
    this.parent = parent;
    this.child = child;
    this.isLeft = isLeft;
    this.isRight = isRight;
    this.progress = 0;

    // Calculate the midpoint where branching occurs
    this.midY = parent.y + (child.y - parent.y) * 0.6;

    // Use the actual child x-coordinate
    // This ensures the edge will connect directly to the child node
    this.branchX = child.x;
  }

  update() {
    if (this.parent.visible && this.progress < 1) {
      this.progress += 0.01; // Adjust animation speed
    }
    if (this.progress >= 1) {
      this.child.visible = true;
    }
  }

  color() {
    return this.child.color();
  }

  render(p5) {
    if (!this.parent.visible) return;

    // Calculate path lengths
    const verticalDist1 = this.midY - this.parent.y;
    const horizontalDist = Math.abs(this.branchX - this.parent.x);
    const verticalDist2 = this.child.y - this.midY;
    const totalLength = verticalDist1 + horizontalDist + verticalDist2;

    // Calculate how much of each segment to draw
    const currentLength = totalLength * this.progress;

    p5.stroke(180, 190, 205);
    p5.strokeWeight(1.5);
    p5.noFill();

    // Always draw the first vertical segment from parent
    if (currentLength > 0) {
      const firstSegmentLength = Math.min(currentLength, verticalDist1);
      const currentMidY = p5.lerp(this.parent.y, this.midY, firstSegmentLength / verticalDist1);
      p5.line(this.parent.x, this.parent.y, this.parent.x, currentMidY);
    }

    if (currentLength > verticalDist1) {
      // Draw second segment (horizontal)
      const secondSegmentLength = Math.min(currentLength - verticalDist1, horizontalDist);
      const currentBranchX = p5.lerp(this.parent.x, this.branchX, secondSegmentLength / horizontalDist);
      p5.line(this.parent.x, this.midY, currentBranchX, this.midY);

      if (currentLength > verticalDist1 + horizontalDist) {
        // Draw third segment (vertical to child)
        const thirdSegmentLength = currentLength - verticalDist1 - horizontalDist;
        const currentChildY = p5.lerp(this.midY, this.child.y, thirdSegmentLength / verticalDist2);
        p5.line(this.branchX, this.midY, this.branchX, currentChildY);
      }
    }
  }
}

// Create a modified sketch for each stage
function createTreeSketch(stageId) {
  return function(p5) {
    let nodes = [];
    let edges = [];
    let treeData = stageData[stageId];

    p5.setup = function() {
      const canvas = p5.createCanvas(p5.windowWidth * 0.4, p5.windowHeight);
      canvas.parent('canvas-container');
      p5.smooth();
      p5.frameRate(60);

      if (treeData) {
        createTreeFromData(treeData);
      }
    };

    p5.windowResized = function() {
      p5.resizeCanvas(p5.windowWidth * 0.4, p5.windowHeight);
    };

    function createTreeFromData(data) {
      // Clear existing nodes and edges
      nodes = [];
      edges = [];

      // Add defensive checks to prevent errors
      if (!data || !data.layout || !Array.isArray(data.layout) || !data.edges || !Array.isArray(data.edges)) {
        console.error("Invalid tree data format:", data);
        return; // Exit if data structure is invalid
      }

      // Find all parent nodes in edges
      const parentNodes = new Set();
      for (const [parentId, childId] of data.edges) {
        parentNodes.add(parentId);
      }

      // Create nodes
      for (let i = 0; i < data.layout.length; i++) {
        const [nx, ny] = data.layout[i];
        // A node is a root if it's a parent and not a child in any edge
        const isRoot = parentNodes.has(i) && data.edges.every(edge => edge[1] !== i);

        const node = new Node(
          nx * p5.width * 0.8 + p5.width * 0.1,
          ny * p5.height * 0.8 + p5.height * 0.1,
          i,
          isRoot
        );
        nodes.push(node);
      }

      // If no root was found, make the first parent node visible
      if (!nodes.some(node => node.visible) && parentNodes.size > 0) {
        // Get the first parent node
        const firstParentId = [...parentNodes][0];
        if (nodes[firstParentId]) {
          nodes[firstParentId].visible = true;
        }
      }

      // Create edges
      for (const [parentId, childId] of data.edges) {
        const parent = nodes[parentId];
        const child = nodes[childId];
        if (parent && child) { // Verify both nodes exist
          const isLeft = child.x < parent.x;
          const isRight = child.x > parent.x;
          edges.push(new Edge(parent, child, isLeft, isRight));
        }
      }

      // Select the first node by default
      if (nodes.length > 0) {
        nodes[0].selected = true;
        updateNodeInfo(0);
      }
    }

    p5.draw = function() {
      // Use the global background color if available, otherwise use the default bgCol
      const currentBgColor = window.bgColCurrent || bgCol;
      p5.background(currentBgColor);

      // Update and render edges
      for (const edge of edges) {
        edge.update();
        edge.render(p5);
      }

      // Update and render nodes
      for (const node of nodes) {
        node.update();
        node.render(p5);
      }

      // Handle mouse hover
      p5.cursor(p5.ARROW);
      for (const node of nodes) {
        if (node.isMouseOver(p5)) {
          p5.cursor(p5.HAND);
        }
      }
    };

    p5.mousePressed = function() {
      // Check if any node was clicked
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].visible && nodes[i].isMouseOver(p5)) {
          // Deselect all nodes
          nodes.forEach(n => n.selected = false);
          // Select the clicked node
          nodes[i].selected = true;
          // Update the right panel with node info
          updateNodeInfo(i);
          break;
        }
      }
    };

    function updateNodeInfo(nodeIndex) {
      if (treeData) {
        setNodeInfo(
          treeData.code[nodeIndex],
          treeData.plan[nodeIndex],
          treeData.plot_code?.[nodeIndex],
          treeData.plot_plan?.[nodeIndex],
          treeData.metrics?.[nodeIndex],
          treeData.exc_type?.[nodeIndex] || '',
          treeData.exc_info?.[nodeIndex]?.args?.[0] || '',
          treeData.exc_stack?.[nodeIndex] || [],
          treeData.plots?.[nodeIndex] || [],
          treeData.plot_analyses?.[nodeIndex] || [],
          treeData.vlm_feedback_summary?.[nodeIndex] || '',
          treeData.datasets_successfully_tested?.[nodeIndex] || [],
          treeData.exec_time_feedback?.[nodeIndex] || '',
          treeData.exec_time?.[nodeIndex] || ''
        );
      }
    }
  };
}

// Start a new p5 sketch for the given stage
function startSketch(stageId) {
  if (currentSketch) {
    currentSketch.remove();
  }

  if (stageData[stageId]) {
    currentSketch = new p5(createTreeSketch(stageId));

    // Update stage info
    const stageNumber = stageId.split('_')[1];
    let stageDesc = '';
    switch(stageId) {
      case 'Stage_1': stageDesc = 'Preliminary Investigation'; break;
      case 'Stage_2': stageDesc = 'Baseline Tuning'; break;
      case 'Stage_3': stageDesc = 'Research Agenda Execution'; break;
      case 'Stage_4': stageDesc = 'Ablation Studies'; break;
    }

    document.getElementById('stage-info').innerHTML =
      `<strong>Current Stage: ${stageNumber} - ${stageDesc}</strong>`;
  }
}

// Handle tab selection
function selectStage(stageId) {
  if (!stageData[stageId] || !availableStages.includes(stageId)) {
    return; // Don't allow selection of unavailable stages
  }

  // Update active tab styles
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelector(`.tab[data-stage="${stageId}"]`).classList.add('active');

  // Start the new sketch
  currentStage = stageId;
  startSketch(stageId);
}

// Function to load the tree data for all stages
async function loadAllStageData(baseTreeData) {
  console.log("Loading stage data with base data:", baseTreeData);

  // The base tree data is for the current stage
  const currentStageId = baseTreeData.current_stage || 'Stage_1';

  // Ensure base tree data is valid and has required properties
  if (baseTreeData && baseTreeData.layout && baseTreeData.edges) {
    stageData[currentStageId] = baseTreeData;
    availableStages.push(currentStageId);
    console.log(`Added current stage ${currentStageId} to available stages`);
  } else {
    console.warn(`Current stage ${currentStageId} data is invalid:`, baseTreeData);
  }

  // Use relative path to load other stage trees
  const logDirPath = baseTreeData.log_dir_path || '.';
  console.log("Log directory path:", logDirPath);

  // Load data for each stage if available
  const stageNames = ['Stage_1', 'Stage_2', 'Stage_3', 'Stage_4'];
  const stageNames2actualNames = {
    'Stage_1': 'stage_1_initial_implementation_1_preliminary',
    'Stage_2': 'stage_2_baseline_tuning_1_first_attempt',
    'Stage_3': 'stage_3_creative_research_1_first_attempt',
    'Stage_4': 'stage_4_ablation_studies_1_first_attempt'
    }

  for (const stage of stageNames) {

    if (baseTreeData.completed_stages && baseTreeData.completed_stages.includes(stage)) {
      try {
        console.log(`Attempting to load data for ${stage} from ${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);
        const response = await fetch(`${logDirPath}/${stageNames2actualNames[stage]}/tree_data.json`);

        if (response.ok) {
          const data = await response.json();

          // Validate the loaded data
          if (data && data.layout && data.edges) {
            stageData[stage] = data;
            availableStages.push(stage);
            console.log(`Successfully loaded and validated data for ${stage}`);
          } else {
            console.warn(`Loaded data for ${stage} is invalid:`, data);
          }
        } else {
          console.warn(`Failed to load data for ${stage} - HTTP status ${response.status}`);
        }
      } catch (error) {
        console.error(`Error loading data for ${stage}:`, error);
      }
    } else {
      console.log(`Skipping stage ${stage} - not in completed stages list:`, baseTreeData.completed_stages);
    }
  }

  // Update tab visibility based on available stages
  updateTabVisibility();

  // Start with the first available stage
  if (availableStages.length > 0) {
    selectStage(availableStages[0]);
  } else {
    console.warn("No stages available to display");
    // Display a message in the canvas area
    document.getElementById('canvas-container').innerHTML =
      '<div style="padding: 20px; color: #333; text-align: center;"><h3>No valid tree data available to display</h3></div>';
  }
}

// Update tab visibility based on available stages
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    const stageId = tab.getAttribute('data-stage');
    if (availableStages.includes(stageId)) {
      tab.classList.remove('disabled');
    } else {
      tab.classList.add('disabled');
    }
  });
}

// Utility function to set the node info in the right panel
const setNodeInfo = (code, plan, plot_code, plot_plan, metrics = null, exc_type = '', exc_info = '',
    exc_stack = [], plots = [], plot_analyses = [], vlm_feedback_summary = '',
    datasets_successfully_tested = [], exec_time_feedback = '', exec_time = '') => {
  const codeElm = document.getElementById("code");
  if (codeElm) {
    if (code) {
      codeElm.innerHTML = hljs.highlight(code, { language: "python" }).value;
    } else {
      codeElm.innerHTML = '<p>No code available</p>';
    }
  }

  const planElm = document.getElementById("plan");
  if (planElm) {
    if (plan) {
      planElm.innerHTML = hljs.highlight(plan, { language: "plaintext" }).value;
    } else {
      planElm.innerHTML = '<p>No plan available</p>';
    }
  }

  const plot_codeElm = document.getElementById("plot_code");
  if (plot_codeElm) {
    if (plot_code) {
      plot_codeElm.innerHTML = hljs.highlight(plot_code, { language: "python" }).value;
    } else {
      plot_codeElm.innerHTML = '<p>No plot code available</p>';
    }
  }

  const plot_planElm = document.getElementById("plot_plan");
  if (plot_planElm) {
    if (plot_plan) {
      plot_planElm.innerHTML = hljs.highlight(plot_plan, { language: "plaintext" }).value;
    } else {
      plot_planElm.innerHTML = '<p>No plot plan available</p>';
    }
  }

  const metricsElm = document.getElementById("metrics");
  if (metricsElm) {
      let metricsContent = `<h3>Metrics:</h3>`;
      if (metrics && metrics.metric_names) {
          for (const metric of metrics.metric_names) {
              metricsContent += `<div class="metric-group">`;
              metricsContent += `<h4>${metric.metric_name}</h4>`;
              metricsContent += `<p><strong>Description:</strong> ${metric.description || 'N/A'}</p>`;
              metricsContent += `<p><strong>Optimization:</strong> ${metric.lower_is_better ? 'Minimize' : 'Maximize'}</p>`;

              // Create table for dataset values
              metricsContent += `<table class="metric-table">
                  <tr>
                      <th>Dataset</th>
                      <th>Final Value</th>
                      <th>Best Value</th>
                  </tr>`;

              for (const dataPoint of metric.data) {
                  metricsContent += `<tr>
                      <td>${dataPoint.dataset_name}</td>
                      <td>${dataPoint.final_value?.toFixed(4) || 'N/A'}</td>
                      <td>${dataPoint.best_value?.toFixed(4) || 'N/A'}</td>
                  </tr>`;
              }

              metricsContent += `</table></div>`;
          }
      } else if (metrics === null) {
          metricsContent += `<p>No metrics available</p>`;
      }
      metricsElm.innerHTML = metricsContent;
  }

  // Add plots display
  const plotsElm = document.getElementById("plots");
  if (plotsElm) {
      if (plots && plots.length > 0) {
          let plotsContent = '';
          plots.forEach(plotPath => {
              plotsContent += `
                  <div class="plot-item">
                      <img src="${plotPath}" alt="Experiment Plot" onerror="console.error('Failed to load plot:', this.src)"/>
                  </div>`;
          });
          plotsElm.innerHTML = plotsContent;
      } else {
          plotsElm.innerHTML = '';
      }
  }

  // Add error info display
  const errorElm = document.getElementById("exc_info");
  if (errorElm) {
    if (exc_type) {
      let errorContent = `<h3 style="color: #ff5555">Exception Information:</h3>
                          <p><strong>Type:</strong> ${exc_type}</p>`;

      if (exc_info) {
        errorContent += `<p><strong>Details:</strong> <pre>${JSON.stringify(exc_info, null, 2)}</pre></p>`;
      }

      if (exc_stack) {
        errorContent += `<p><strong>Stack Trace:</strong> <pre>${exc_stack.join('\n')}</pre></p>`;
      }

      errorElm.innerHTML = errorContent;
    } else {
      errorElm.innerHTML = "No exception info available";
    }
  }

  const exec_timeElm = document.getElementById("exec_time");
  if (exec_timeElm) {
    let exec_timeContent = '<div id="exec_time"><h3>Execution Time (in seconds):</h3><p>' + exec_time + '</p></div>';
    exec_timeElm.innerHTML = exec_timeContent;
  }

  const exec_time_feedbackElm = document.getElementById("exec_time_feedback");
  if (exec_time_feedbackElm) {
    let exec_time_feedbackContent = '<div id="exec_time_feedback_content">'
    exec_time_feedbackContent += '<h3>Execution Time Feedback:</h3>'
    exec_time_feedbackContent += '<p>' + exec_time_feedback + '</p>'
    exec_time_feedbackContent += '</div>';
    exec_time_feedbackElm.innerHTML = exec_time_feedbackContent;
  }

  const vlm_feedbackElm = document.getElementById("vlm_feedback");
  if (vlm_feedbackElm) {
      let vlm_feedbackContent = '';

      if (plot_analyses && plot_analyses.length > 0) {
          vlm_feedbackContent += `<h3>Plot Analysis:</h3>`;
          plot_analyses.forEach(analysis => {
              if (analysis && analysis.plot_path) {  // Add null check
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <h4>Analysis for ${analysis.plot_path.split('/').pop()}</h4>
                          <p>${analysis.analysis || 'No analysis available'}</p>
                          <ul class="key-findings">
                              ${(analysis.key_findings || []).map(finding => `<li>${finding}</li>`).join('')}
                          </ul>
                      </div>`;
              } else {
                  console.warn('Received invalid plot analysis:', analysis);
                  vlm_feedbackContent += `
                      <div class="plot-analysis">
                          <p>Invalid plot analysis data received</p>
                      </div>`;
              }
          });
      }

      // Add actionable insights if available
      if (vlm_feedback_summary && typeof vlm_feedback_summary === 'string') {
          vlm_feedbackContent += `
              <div class="vlm_feedback">
                  <h3>VLM Feedback Summary:</h3>
                  <p>${vlm_feedback_summary}</p>
              </div>`;
      }

      console.log("Datasets successfully tested:", datasets_successfully_tested);
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          vlm_feedbackContent += `
              <div id="datasets_successfully_tested">
                  <h3>Datasets Successfully Tested:</h3>
                  <p>${datasets_successfully_tested.join(', ')}</p>
              </div>`;
      }

      if (!vlm_feedbackContent) {
          vlm_feedbackContent = '<p>No insights available for this experiment.</p>';
      }

      vlm_feedbackElm.innerHTML = vlm_feedbackContent;
  }

  const datasets_successfully_testedElm = document.getElementById("datasets_successfully_tested");
  if (datasets_successfully_testedElm) {
      let datasets_successfully_testedContent = '';
      if (datasets_successfully_tested && datasets_successfully_tested.length > 0) {
          datasets_successfully_testedContent = `<h3>Datasets Successfully Tested:</h3><ul>`;
          datasets_successfully_tested.forEach(dataset => {
              datasets_successfully_testedContent += `<li>${dataset}</li>`;
          });
          datasets_successfully_testedContent += `</ul>`;
      } else {
          datasets_successfully_testedContent = '<p>No datasets tested yet</p>';
      }
      datasets_successfully_testedElm.innerHTML = datasets_successfully_testedContent;
  }
};

// Initialize with the provided tree data
const treeStructData = {"edges": [[0, 2], [0, 6], [0, 1], [0, 5], [1, 4], [2, 3], [3, 7], [3, 8]], "layout": [[0.5, 0.0], [0.0, 0.33333333333333337], [0.3333333333333333, 0.33333333333333337], [0.3333333333333333, 0.6666666666666667], [0.0, 0.6666666666666667], [0.6666666666666666, 0.33333333333333337], [1.0, 0.33333333333333337], [0.16666666666666666, 1.0], [0.5, 1.0]], "plan": ["The crash happens at `from datasets import load_dataset` itself, because the\ninstalled `pyarrow` (>=14) removed `pa.PyExtensionType`, which the `datasets`\nlibrary's `features.py` module references at class-definition time. This is an\nenvironment version-mismatch bug, not a logic bug, so the fix is to shim\n`pyarrow.PyExtensionType = pyarrow.ExtensionType` before `datasets` is imported\nanywhere \u2014 since our image/tabular loaders never use the `Array2D/3D/4D/5D`\nextension types, this only needs to satisfy the class definition, not actual\ninstantiation, so it is safe. I also added a synthetic fallback for the image\nloader (mirroring the existing tabular fallback) so the script cannot crash if\nthe load still fails for any other reason (e.g. no network), guaranteeing the\n\"three HF datasets\" pipeline still runs to completion.", "Ablation name: Post-hoc Calibration Method Substitution (Temperature Scaling vs.\nVector/Histogram Scaling). This ablation keeps the training, compression grid\n(bits \u00d7 sparsity), and datasets identical to the baseline, but at each\ncompressed checkpoint it fits and applies three separate post-hoc calibrators\n(temperature scaling, per-class vector scaling via LBFGS on an affine logit\ntransform, and non-parametric confidence histogram binning) instead of just\ntemperature scaling. Results are stored under three top-level ablation keys in\n`experiment_data` so `calibration_recovery_ratio` and its correlation with\ncompression ratio can be compared calibrator-by-calibrator, using a shared\nbaseline-ECE-after-calibration denominator computed separately per calibrator.\nVector scaling is fit with LBFGS minimizing per-class-scaled+biased-logit NLL on\nthe validation split; histogram binning bins validation confidences into 15\nbins, maps each to its empirical bin accuracy, and rescales the non-top-class\nprobability mass proportionally to preserve a valid simplex. Heatmaps and\nbar/scatter comparison plots are generated per calibrator, plus a grouped cross-\ncalibrator CRR comparison plot.", "Ablation name: Compression Order Ablation (Prune-then-Quantize vs. Quantize-\nthen-Prune). Ablation swaps the pruning/quantization order in `compress_model`\n(adding an `order` parameter), trains each model once, then reruns the full\nbits\u00d7sparsity grid under both `prune_then_quantize` and `quantize_then_prune`\norderings, storing results under separate top-level ablation keys as required by\nthe data-saving convention. Since training is independent of compression order,\ntraining curves/baseline predictions are computed once and duplicated into both\nablation branches to avoid wasted compute. I add per-order heatmaps plus a\ncross-order comparison plot of mean calibration_recovery_ratio and ECE deltas\nper dataset/config to directly test whether the ordering itself drives the\nrecovery pattern.", "The core bug is in the calibration_recovery_ratio (temperature_recovery_ratio)\ncalculation: the denominator uses `base_ece_ref` (the *refit* baseline ECE)\ninstead of `base_ece` (the *original uncalibrated* pre-compression ECE) as\nspecified by the metric definition. This causes a degenerate identity at the\nbaseline config (always exactly 1.000, since numerator and denominator become\nalgebraically equal) and produces wildly unstable ratios elsewhere (e.g.\nCRR=-3.149, -2.035) because the denominator is often tiny and doesn't correspond\nto the intended reference quantity. I fix this by setting the denominator to\n`base_ece` (original pre-compression, uncalibrated ECE) consistently, and rename\nthe field to `temperature_recovery_ratio` throughout (results dict, plots,\naggregation) to match the required metric name. I also add temperature clamping\nin `fit_temperature` to prevent numerically degenerate T\u21920 solutions (seen as\n`T=0.000`, ECE exploding to 0.34) that were polluting the metric on\ncollapsed/degenerate compression configs.", "The core bug is in how `calibration_recovery_ratio` (which should implement the\nrequired `temperature_recovery_ratio` metric) is computed: the denominator was\nset to `ece_b - base_ece_ref[cal]`, where `base_ece_ref[cal]` was the *post-\ncalibration* ECE at the uncompressed baseline, not the *original uncalibrated*\nECE as the metric spec requires. This made the baseline config a tautology (CRR\nalways exactly 1.0 at bits=32/sparsity=0) and produced nonsensical/unstable\nratios elsewhere (values >2, large negatives) since the denominator could be\ntiny or even flip sign independently of the numerator's meaning. The fix stores\na single per-dataset constant `base_ece_uncalibrated` equal to the uncompressed\nmodel's pre-calibration ECE (computed once, calibrator-independent since it's\nmeasured before any calibrator is applied), and uses that as the fixed\ndenominator for all compression configs and calibrators, matching the specified\nformula `(ECE_compressed_uncalibrated - ECE_compressed_refit) /\nECE_original_uncalibrated`. I also renamed the metric key throughout to\n`temperature_recovery_ratio` to match the required metric name, keeping the\ncomparison across all three calibrators (temperature scaling, vector scaling,\nhistogram binning) as the ablation component analysis.", "Ablation name: Calibration Metric Sensitivity to Compression Granularity (Per-\nLayer vs. Global Quantization/Pruning). This ablation replaces the uniform\n`compress_model` call with three allocation strategies at matched average\ncompression ratios: `global` (existing uniform baseline), `sensitivity_variance`\n(layers with lower weight variance, presumed less sensitive, get\npruned/quantized more aggressively), and `depth_based` (early feature-extraction\nlayers get compressed more than the final classifier layer). A shared helper\n`allocate_ranked_sparsity` renormalizes a rank-based sparsity ramp so the\nparameter-weighted mean sparsity matches the global target, keeping total\ncompression ratios comparable across strategies. For each dataset the model is\ntrained once, then the (bits \u00d7 sparsity) grid is swept once per strategy,\nrecording ECE/Brier/CRR/temperature under each schedule so the strategies can be\ncompared directly at matched compression budgets, with results and comparison\nplots saved to `experiment_data.npy` under a new `compression_granularity`\nablation key.", "Ablation name: Calibration Recovery Under Fine-Tuning vs. Post-Hoc Temperature\nRefit. This ablation adds a fine-tuning arm alongside the existing temperature-\nrefit arm for every point in the bits/sparsity grid: after compressing a copy of\nthe trained model, I run a short low-LR fine-tune (2 epochs, lr=1e-4) on the\nsame train split, re-evaluate accuracy/ECE/Brier at T=1.0, and compute a\n`finetune_recovery_ratio` using the same normalization as the existing\n`calibration_recovery_ratio`, so the two are directly comparable. I also record\nwall-clock time for the temperature fit vs. the fine-tune pass to compare\ncompute cost, and wrap everything under a single top-level ablation key\n(`finetune_vs_temp_refit`) per the required experiment_data schema, with new\ncross-dataset plots comparing the two recovery ratios and their costs.", "Seed node", "Seed node"], "code": ["import os\nimport copy\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# --- Compatibility shim: newer pyarrow removed PyExtensionType, which the\n# `datasets` library references at class-definition time in features.py.\n# We never use Array2D/3D/4D/5D features, so aliasing to ExtensionType is\n# safe (only needed to satisfy the class statement, not instantiation).\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nexperiment_data = {\n    \"mnist\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    },\n    \"fashion_mnist\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    },\n    \"adult_income\": {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    },\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration utilities ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        T = torch.exp(logT)\n        loss = nll(logits / T, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    return torch.exp(logT).item()\n\n\ndef eval_model(m, X, y, n_classes, T=1.0):\n    m.eval()\n    with torch.no_grad():\n        logits = m(X)\n        probs = F.softmax(logits / T, dim=1)\n        acc = (probs.argmax(1) == y).float().mean().item()\n        ece = compute_ece(probs, y)\n        brier = compute_brier(probs, y, n_classes)\n    return acc, ece, brier, logits\n\n\n# ---------------- Compression ----------------\ndef get_compress_layers(m):\n    return [layer for layer in m.modules() if isinstance(layer, (nn.Linear, nn.Conv2d))]\n\n\ndef quantize_layer_weight(w, bits):\n    levels = 2**bits\n    wmin, wmax = w.min(), w.max()\n    scale = (wmax - wmin) / (levels - 1) if levels > 1 else (wmax - wmin)\n    if scale.item() == 0:\n        return w\n    q = torch.clamp(torch.round((w - wmin) / scale), 0, levels - 1)\n    return q * scale + wmin\n\n\ndef prune_layer_weight(w, sparsity):\n    if sparsity <= 0:\n        return w\n    flat = w.abs().flatten()\n    k = int(sparsity * flat.numel())\n    if k <= 0:\n        return w\n    threshold = torch.kthvalue(flat, k).values\n    mask = w.abs() > threshold\n    return w * mask.float()\n\n\ndef compress_model(model, bits=32, sparsity=0.0):\n    cm = copy.deepcopy(model)\n    with torch.no_grad():\n        for layer in get_compress_layers(cm):\n            w = layer.weight.data\n            if sparsity > 0:\n                w = prune_layer_weight(w, sparsity)\n            if bits < 32:\n                w = quantize_layer_weight(w, bits)\n            layer.weight.data.copy_(w)\n    return cm\n\n\ndef r_squared(x, y, coeffs):\n    yhat = np.polyval(coeffs, x)\n    ss_res = np.sum((y - yhat) ** 2)\n    ss_tot = np.sum((y - np.mean(y)) ** 2)\n    return 1 - ss_res / ss_tot if ss_tot > 0 else float(\"nan\")\n\n\ndef plot_heatmap(grid, bits_list, sparsity_list, title, fname):\n    plt.figure(figsize=(6, 5))\n    plt.imshow(grid, aspect=\"auto\", cmap=\"viridis\")\n    plt.colorbar(label=\"ECE\")\n    plt.xticks(range(len(sparsity_list)), [str(s) for s in sparsity_list])\n    plt.yticks(range(len(bits_list)), [str(b) for b in bits_list])\n    plt.xlabel(\"Sparsity\")\n    plt.ylabel(\"Bit-width (32=no quant)\")\n    plt.title(title)\n    for i in range(len(bits_list)):\n        for j in range(len(sparsity_list)):\n            plt.text(\n                j,\n                i,\n                f\"{grid[i, j]:.3f}\",\n                ha=\"center\",\n                va=\"center\",\n                color=\"white\",\n                fontsize=7,\n            )\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, fname))\n    plt.close()\n\n\n# ---------------- Training loop ----------------\ndef train_loop(model, X_tr, y_tr, X_val, y_val, epochs, batch_size, dataset_key):\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    for epoch in range(epochs):\n        model.train()\n        perm = torch.randperm(n_train)\n        total_loss, correct = 0.0, 0\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            logits = model(xb)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * xb.size(0)\n            correct += (logits.argmax(1) == yb).sum().item()\n        train_loss = total_loss / n_train\n        train_acc = correct / n_train\n\n        model.eval()\n        with torch.no_grad():\n            val_logits = model(X_val)\n            val_loss = criterion(val_logits, y_val).item()\n            val_acc = (val_logits.argmax(1) == y_val).float().mean().item()\n\n        print(\n            f\"[{dataset_key}] Epoch {epoch}: validation_loss = {val_loss:.4f}, val_acc = {val_acc:.4f}\"\n        )\n        experiment_data[dataset_key][\"losses\"][\"train\"].append(\n            {\"epoch\": epoch, \"loss\": train_loss}\n        )\n        experiment_data[dataset_key][\"losses\"][\"val\"].append(\n            {\"epoch\": epoch, \"loss\": val_loss}\n        )\n        experiment_data[dataset_key][\"metrics\"][\"train\"].append(\n            {\"epoch\": epoch, \"acc\": train_acc, \"calibration_recovery_ratio\": np.nan}\n        )\n        experiment_data[dataset_key][\"metrics\"][\"val\"].append(\n            {\"epoch\": epoch, \"acc\": val_acc, \"calibration_recovery_ratio\": np.nan}\n        )\n\n\n# ---------------- Main experiment per dataset ----------------\ndataset_specs = [\n    {\"key\": \"mnist\", \"type\": \"image\", \"hf_name\": \"mnist\", \"n_classes\": 10, \"epochs\": 5},\n    {\n        \"key\": \"fashion_mnist\",\n        \"type\": \"image\",\n        \"hf_name\": \"fashion_mnist\",\n        \"n_classes\": 10,\n        \"epochs\": 5,\n    },\n    {\"key\": \"adult_income\", \"type\": \"tabular\", \"n_classes\": 2, \"epochs\": 12},\n]\n\nbits_list = [32, 8, 4, 2]\nsparsity_list = [0.0, 0.3, 0.5, 0.7, 0.9, 0.95]\n\nall_crr = []\ntemp_reg_data = {\"ratio\": [], \"T\": [], \"dataset\": []}\n\nfor spec in dataset_specs:\n    key = spec[\"key\"]\n    print(f\"\\n===== Dataset: {key} =====\")\n    if spec[\"type\"] == \"image\":\n        X, y = load_image_dataset(spec[\"hf_name\"], n_samples=6000, seed=0)\n    else:\n        X, y = load_tabular_dataset(n_samples=6000, seed=0)\n\n    X_tr, y_tr, X_val, y_val, X_te, y_te = make_splits(X, y, seed=0)\n    X_tr_t = torch.tensor(X_tr).to(device)\n    y_tr_t = torch.tensor(y_tr, dtype=torch.long).to(device)\n    X_val_t = torch.tensor(X_val).to(device)\n    y_val_t = torch.tensor(y_val, dtype=torch.long).to(device)\n    X_te_t = torch.tensor(X_te).to(device)\n    y_te_t = torch.tensor(y_te, dtype=torch.long).to(device)\n\n    n_classes = spec[\"n_classes\"]\n    if spec[\"type\"] == \"image\":\n        model = TinyCNN(n_classes).to(device)\n    else:\n        model = TinyMLP(X.shape[1], n_classes).to(device)\n    n_params = sum(p.numel() for p in model.parameters())\n    print(f\"[{key}] model has {n_params} parameters\")\n\n    train_loop(model, X_tr_t, y_tr_t, X_val_t, y_val_t, spec[\"epochs\"], 64, key)\n\n    # baseline calibration\n    base_acc, base_ece, base_brier, base_test_logits = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=1.0\n    )\n    _, _, _, base_val_logits = eval_model(model, X_val_t, y_val_t, n_classes, T=1.0)\n    base_T = fit_temperature(base_val_logits.detach(), y_val_t)\n    base_acc_ref, base_ece_ref, base_brier_ref, _ = eval_model(\n        model, X_te_t, y_te_t, n_classes, T=base_T\n    )\n    print(\n        f\"[{key}] Original: acc={base_acc:.4f} ECE={base_ece:.4f} | +refit(T={base_T:.3f}): \"\n        f\"acc={base_acc_ref:.4f} ECE={base_ece_ref:.4f}\"\n    )\n\n    with torch.no_grad():\n        experiment_data[key][\"predictions\"] = (\n            F.softmax(base_test_logits, dim=1).cpu().numpy()\n        )\n    experiment_data[key][\"ground_truth\"] = y_te_t.cpu().numpy()\n\n    ece_before_grid = np.zeros((len(bits_list), len(sparsity_list)))\n    ece_after_grid = np.zeros((len(bits_list), len(sparsity_list)))\n\n    for bi, bits in enumerate(bits_list):\n        for si, sp in enumerate(sparsity_list):\n            compression_ratio = (bits / 32.0) * (1 - sp)\n            if bits == 32 and sp == 0.0:\n                acc_b, ece_b, brier_b = base_acc, base_ece, base_brier\n                T_opt = base_T\n                acc_a, ece_a, brier_a = base_acc_ref, base_ece_ref, base_brier_ref\n                ece_static = base_ece_ref\n            else:\n                cm = compress_model(model, bits=bits, sparsity=sp).to(device)\n                acc_b, ece_b, brier_b, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=1.0\n                )\n                _, _, _, val_logits = eval_model(cm, X_val_t, y_val_t, n_classes, T=1.0)\n                T_opt = fit_temperature(val_logits.detach(), y_val_t)\n                acc_a, ece_a, brier_a, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=T_opt\n                )\n                _, ece_static, _, _ = eval_model(\n                    cm, X_te_t, y_te_t, n_classes, T=base_T\n                )\n\n            denom = ece_b - base_ece_ref\n            crr = (ece_b - ece_a) / denom if abs(denom) > 1e-8 else np.nan\n            if not np.isnan(crr):\n                all_crr.append(crr)\n\n            temp_reg_data[\"ratio\"].append(compression_ratio)\n            temp_reg_data[\"T\"].append(T_opt)\n            temp_reg_data[\"dataset\"].append(key)\n\n            ece_before_grid[bi, si] = ece_b\n            ece_after_grid[bi, si] = ece_a\n\n            experiment_data[key][\"compression_results\"].append(\n                {\n                    \"bits\": bits,\n                    \"sparsity\": sp,\n                    \"compression_ratio\": compression_ratio,\n                    \"acc_before\": acc_b,\n                    \"ece_before\": ece_b,\n                    \"brier_before\": brier_b,\n                    \"acc_after\": acc_a,\n                    \"ece_after\": ece_a,\n                    \"brier_after\": brier_a,\n                    \"ece_after_static_T\": ece_static,\n                    \"temperature\": T_opt,\n                    \"calibration_recovery_ratio\": crr,\n                }\n            )\n            print(\n                f\"[{key}] bits={bits} sparsity={sp}: acc={acc_a:.4f} ECE_before={ece_b:.4f} \"\n                f\"ECE_after={ece_a:.4f} T={T_opt:.3f} CRR={crr:.3f}\"\n            )\n\n    # temperature vs compression_ratio regression\n    ratios = np.array(\n        [r[\"compression_ratio\"] for r in experiment_data[key][\"compression_results\"]]\n    )\n    temps = np.array(\n        [r[\"temperature\"] for r in experiment_data[key][\"compression_results\"]]\n    )\n    coeffs = np.polyfit(ratios, temps, 1)\n    r2 = r_squared(ratios, temps, coeffs)\n    experiment_data[key][\"temp_regression_r2\"] = r2\n    print(f\"[{key}] Temperature ~ compression_ratio regression R^2 = {r2:.4f}\")\n\n    plot_heatmap(\n        ece_before_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE before refit\",\n        f\"{key}_ece_heatmap_before.png\",\n    )\n    plot_heatmap(\n        ece_after_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE after refit\",\n        f\"{key}_ece_heatmap_after.png\",\n    )\n\navg_crr = float(np.nanmean(all_crr))\nprint(\n    f\"\\n=== Overall average calibration_recovery_ratio across all datasets/configs: {avg_crr:.4f} ===\"\n)\n\n# ---------------- Cross-dataset plots ----------------\nplt.figure()\nds_keys = [s[\"key\"] for s in dataset_specs]\ncrr_means = []\nfor key in ds_keys:\n    vals = [\n        r[\"calibration_recovery_ratio\"]\n        for r in experiment_data[key][\"compression_results\"]\n        if not np.isnan(r[\"calibration_recovery_ratio\"])\n    ]\n    crr_means.append(np.mean(vals))\nplt.bar(ds_keys, crr_means, color=[\"tab:blue\", \"tab:orange\", \"tab:green\"])\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.ylabel(\"Mean calibration_recovery_ratio\")\nplt.title(\"Temperature refit recovery of compression-induced miscalibration\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"calibration_recovery_ratio_by_dataset.png\"))\nplt.close()\n\nplt.figure()\ncolors = {\n    \"mnist\": \"tab:blue\",\n    \"fashion_mnist\": \"tab:orange\",\n    \"adult_income\": \"tab:green\",\n}\nfor key in ds_keys:\n    idx = [i for i, d in enumerate(temp_reg_data[\"dataset\"]) if d == key]\n    ratios = np.array(temp_reg_data[\"ratio\"])[idx]\n    temps = np.array(temp_reg_data[\"T\"])[idx]\n    plt.scatter(ratios, temps, label=key, color=colors[key], alpha=0.7)\nplt.xlabel(\"Compression ratio (bits/32 * (1-sparsity))\")\nplt.ylabel(\"Optimal temperature\")\nplt.title(\"Optimal temperature vs compression ratio\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_vs_compression_ratio.png\"))\nplt.close()\n\n# ---------------- Save experiment data ----------------\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy and plots to working directory.\")\n", "import os\nimport copy\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nCALIBRATOR_NAMES = [\"temperature_scaling\", \"vector_scaling\", \"histogram_binning\"]\nDATASET_KEYS = [\"mnist\", \"fashion_mnist\", \"adult_income\"]\n\n\ndef make_dataset_entry():\n    return {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n        \"crr_vs_compression_r2\": None,\n    }\n\n\nexperiment_data = {\n    cal: {ds: make_dataset_entry() for ds in DATASET_KEYS} for cal in CALIBRATOR_NAMES\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration metrics ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef acc_ece_brier(probs, labels, n_classes):\n    acc = (probs.argmax(1) == labels).float().mean().item()\n    ece = compute_ece(probs, labels)\n    brier = compute_brier(probs, labels, n_classes)\n    return acc, ece, brier\n\n\n# ---------------- Post-hoc calibrators ----------------\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        T = torch.exp(logT)\n        loss = nll(logits / T, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    return torch.exp(logT).item()\n\n\ndef fit_vector_scaling(logits, labels, n_classes, max_iter=100):\n    W = torch.ones(n_classes, device=logits.device, requires_grad=True)\n    b = torch.zeros(n_classes, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([W, b], lr=0.01, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()\n\n    def closure():\n        opt.zero_grad()\n        loss = nll(logits * W + b, labels)\n        loss.backward()\n        return loss\n\n    opt.step(closure)\n    return W.detach(), b.detach()\n\n\ndef fit_histogram_binning(probs_val, labels_val, n_bins=15):\n    confidences, preds = probs_val.max(1)\n    accuracies = (preds == labels_val).float()\n    conf_np = confidences.cpu().numpy()\n    acc_np = accuracies.cpu().numpy()\n    bin_boundaries = np.linspace(0, 1, n_bins + 1)\n    bin_accs = np.zeros(n_bins, dtype=np.float32)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        mask = (conf_np > lo) & (conf_np <= hi)\n        if i == 0:\n            mask = mask | (conf_np <= lo)\n        if mask.sum() > 0:\n            bin_accs[i] = acc_np[mask].mean()\n        else:\n            bin_accs[i] = (lo + hi) / 2.0\n    return bin_boundaries, bin_accs\n\n\ndef apply_histogram_binning(probs, bin_boundaries, bin_accs):\n    n_classes = probs.size(1)\n    confidences, preds = probs.max(1)\n    conf_np = confidences.detach().cpu().numpy()\n    bin_idx = np.clip(np.digitize(conf_np, bin_boundaries[1:-1]), 0, len(bin_accs) - 1)\n    new_conf = torch.tensor(bin_accs[bin_idx], dtype=probs.dtype, device=probs.device)\n    rest_sum = 1.0 - confidences\n    safe = rest_sum > 1e-8\n    scale = torch.where(\n        safe, (1.0 - new_conf) / rest_sum.clamp(min=1e-8), torch.zeros_like(rest_sum)\n    )\n    new_probs = probs * scale.unsqueeze(1)\n    new_probs.scatter_(1, preds.unsqueeze(1), new_conf.unsqueeze(1))\n    if (~safe).any():\n        uniform_val = (1.0 - new_conf) / max(n_classes - 1, 1)\n        fill = uniform_val.unsqueeze(1).expand(-1, n_classes).clone()\n        fill.scatter_(1, preds.unsqueeze(1), new_conf.unsqueeze(1))\n        new_probs = torch.where((~safe).unsqueeze(1), fill, new_probs)\n    return new_probs\n\n\ndef calibrate_temperature(val_logits, y_val, test_logits, n_classes):\n    T = fit_temperature(val_logits.detach(), y_val)\n    probs = F.softmax(test_logits / T, dim=1)\n    return probs, {\"temperature\": T}\n\n\ndef calibrate_vector(val_logits, y_val, test_logits, n_classes):\n    W, b = fit_vector_scaling(val_logits.detach(), y_val, n_classes)\n    probs = F.softmax(test_logits * W + b, dim=1)\n    return probs, {\n        \"vector_W\": W.cpu().numpy().tolist(),\n        \"vector_b\": b.cpu().numpy().tolist(),\n    }\n\n\ndef calibrate_histogram(val_logits, y_val, test_logits, n_classes):\n    probs_val_raw = F.softmax(val_logits, dim=1).detach()\n    bin_bounds, bin_accs = fit_histogram_binning(probs_val_raw, y_val)\n    probs_test_raw = F.softmax(test_logits, dim=1)\n    probs = apply_histogram_binning(probs_test_raw, bin_bounds, bin_accs)\n    return probs, {\"bin_accs\": bin_accs.tolist()}\n\n\nCALIBRATORS = {\n    \"temperature_scaling\": calibrate_temperature,\n    \"vector_scaling\": calibrate_vector,\n    \"histogram_binning\": calibrate_histogram,\n}\n\n\n# ---------------- Compression ----------------\ndef get_compress_layers(m):\n    return [layer for layer in m.modules() if isinstance(layer, (nn.Linear, nn.Conv2d))]\n\n\ndef quantize_layer_weight(w, bits):\n    levels = 2**bits\n    wmin, wmax = w.min(), w.max()\n    scale = (wmax - wmin) / (levels - 1) if levels > 1 else (wmax - wmin)\n    if scale.item() == 0:\n        return w\n    q = torch.clamp(torch.round((w - wmin) / scale), 0, levels - 1)\n    return q * scale + wmin\n\n\ndef prune_layer_weight(w, sparsity):\n    if sparsity <= 0:\n        return w\n    flat = w.abs().flatten()\n    k = int(sparsity * flat.numel())\n    if k <= 0:\n        return w\n    threshold = torch.kthvalue(flat, k).values\n    mask = w.abs() > threshold\n    return w * mask.float()\n\n\ndef compress_model(model, bits=32, sparsity=0.0):\n    cm = copy.deepcopy(model)\n    with torch.no_grad():\n        for layer in get_compress_layers(cm):\n            w = layer.weight.data\n            if sparsity > 0:\n                w = prune_layer_weight(w, sparsity)\n            if bits < 32:\n                w = quantize_layer_weight(w, bits)\n            layer.weight.data.copy_(w)\n    return cm\n\n\ndef r_squared(x, y, coeffs):\n    yhat = np.polyval(coeffs, x)\n    ss_res = np.sum((y - yhat) ** 2)\n    ss_tot = np.sum((y - np.mean(y)) ** 2)\n    return 1 - ss_res / ss_tot if ss_tot > 0 else float(\"nan\")\n\n\ndef plot_heatmap(grid, bits_list, sparsity_list, title, fname):\n    plt.figure(figsize=(6, 5))\n    plt.imshow(grid, aspect=\"auto\", cmap=\"viridis\")\n    plt.colorbar(label=\"ECE\")\n    plt.xticks(range(len(sparsity_list)), [str(s) for s in sparsity_list])\n    plt.yticks(range(len(bits_list)), [str(b) for b in bits_list])\n    plt.xlabel(\"Sparsity\")\n    plt.ylabel(\"Bit-width (32=no quant)\")\n    plt.title(title)\n    for i in range(len(bits_list)):\n        for j in range(len(sparsity_list)):\n            plt.text(\n                j,\n                i,\n                f\"{grid[i, j]:.3f}\",\n                ha=\"center\",\n                va=\"center\",\n                color=\"white\",\n                fontsize=7,\n            )\n    plt.tight_layout()\n    plt.savefig(os.path.join(working_dir, fname))\n    plt.close()\n\n\n# ---------------- Training loop ----------------\ndef train_loop(model, X_tr, y_tr, X_val, y_val, epochs, batch_size, dataset_key):\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n    criterion = nn.CrossEntropyLoss()\n    n_train = X_tr.shape[0]\n    epoch_records = {\"train_loss\": [], \"val_loss\": [], \"train_acc\": [], \"val_acc\": []}\n    for epoch in range(epochs):\n        model.train()\n        perm = torch.randperm(n_train)\n        total_loss, correct = 0.0, 0\n        for i in range(0, n_train, batch_size):\n            idx = perm[i : i + batch_size]\n            xb, yb = X_tr[idx], y_tr[idx]\n            optimizer.zero_grad()\n            logits = model(xb)\n            loss = criterion(logits, yb)\n            loss.backward()\n            optimizer.step()\n            total_loss += loss.item() * xb.size(0)\n            correct += (logits.argmax(1) == yb).sum().item()\n        train_loss = total_loss / n_train\n        train_acc = correct / n_train\n\n        model.eval()\n        with torch.no_grad():\n            val_logits = model(X_val)\n            val_loss = criterion(val_logits, y_val).item()\n            val_acc = (val_logits.argmax(1) == y_val).float().mean().item()\n\n        print(\n            f\"[{dataset_key}] Epoch {epoch}: validation_loss = {val_loss:.4f}, val_acc = {val_acc:.4f}\"\n        )\n        epoch_records[\"train_loss\"].append({\"epoch\": epoch, \"loss\": train_loss})\n        epoch_records[\"val_loss\"].append({\"epoch\": epoch, \"loss\": val_loss})\n        epoch_records[\"train_acc\"].append({\"epoch\": epoch, \"acc\": train_acc})\n        epoch_records[\"val_acc\"].append({\"epoch\": epoch, \"acc\": val_acc})\n    return epoch_records\n\n\n# ---------------- Main experiment per dataset ----------------\ndataset_specs = [\n    {\"key\": \"mnist\", \"type\": \"image\", \"hf_name\": \"mnist\", \"n_classes\": 10, \"epochs\": 5},\n    {\n        \"key\": \"fashion_mnist\",\n        \"type\": \"image\",\n        \"hf_name\": \"fashion_mnist\",\n        \"n_classes\": 10,\n        \"epochs\": 5,\n    },\n    {\"key\": \"adult_income\", \"type\": \"tabular\", \"n_classes\": 2, \"epochs\": 12},\n]\n\nbits_list = [32, 8, 4, 2]\nsparsity_list = [0.0, 0.3, 0.5, 0.7, 0.9, 0.95]\n\nall_crr = {cal: [] for cal in CALIBRATOR_NAMES}\ntemp_reg_data = {\"ratio\": [], \"T\": [], \"dataset\": []}\n\nfor spec in dataset_specs:\n    key = spec[\"key\"]\n    print(f\"\\n===== Dataset: {key} =====\")\n    if spec[\"type\"] == \"image\":\n        X, y = load_image_dataset(spec[\"hf_name\"], n_samples=6000, seed=0)\n    else:\n        X, y = load_tabular_dataset(n_samples=6000, seed=0)\n\n    X_tr, y_tr, X_val, y_val, X_te, y_te = make_splits(X, y, seed=0)\n    X_tr_t = torch.tensor(X_tr).to(device)\n    y_tr_t = torch.tensor(y_tr, dtype=torch.long).to(device)\n    X_val_t = torch.tensor(X_val).to(device)\n    y_val_t = torch.tensor(y_val, dtype=torch.long).to(device)\n    X_te_t = torch.tensor(X_te).to(device)\n    y_te_t = torch.tensor(y_te, dtype=torch.long).to(device)\n\n    n_classes = spec[\"n_classes\"]\n    if spec[\"type\"] == \"image\":\n        model = TinyCNN(n_classes).to(device)\n    else:\n        model = TinyMLP(X.shape[1], n_classes).to(device)\n    n_params = sum(p.numel() for p in model.parameters())\n    print(f\"[{key}] model has {n_params} parameters\")\n\n    epoch_records = train_loop(\n        model, X_tr_t, y_tr_t, X_val_t, y_val_t, spec[\"epochs\"], 64, key\n    )\n    for cal in CALIBRATOR_NAMES:\n        ed = experiment_data[cal][key]\n        for e in range(spec[\"epochs\"]):\n            ed[\"losses\"][\"train\"].append(epoch_records[\"train_loss\"][e])\n            ed[\"losses\"][\"val\"].append(epoch_records[\"val_loss\"][e])\n            ed[\"metrics\"][\"train\"].append(\n                {**epoch_records[\"train_acc\"][e], \"calibration_recovery_ratio\": np.nan}\n            )\n            ed[\"metrics\"][\"val\"].append(\n                {**epoch_records[\"val_acc\"][e], \"calibration_recovery_ratio\": np.nan}\n            )\n        ed[\"ground_truth\"] = y_te_t.cpu().numpy()\n\n    ece_before_grid = np.zeros((len(bits_list), len(sparsity_list)))\n    ece_after_grids = {\n        cal: np.zeros((len(bits_list), len(sparsity_list))) for cal in CALIBRATOR_NAMES\n    }\n    base_ece_ref = {}\n\n    for bi, bits in enumerate(bits_list):\n        for si, sp in enumerate(sparsity_list):\n            compression_ratio = (bits / 32.0) * (1 - sp)\n            if bits == 32 and sp == 0.0:\n                cm = model\n            else:\n                cm = compress_model(model, bits=bits, sparsity=sp).to(device)\n\n            with torch.no_grad():\n                test_logits = cm(X_te_t)\n                val_logits = cm(X_val_t)\n            probs_test_raw = F.softmax(test_logits, dim=1)\n            acc_b, ece_b, brier_b = acc_ece_brier(probs_test_raw, y_te_t, n_classes)\n\n            ece_before_grid[bi, si] = ece_b\n\n            for cal in CALIBRATOR_NAMES:\n                probs_after, params = CALIBRATORS[cal](\n                    val_logits, y_val_t, test_logits, n_classes\n                )\n                acc_a, ece_a, brier_a = acc_ece_brier(probs_after, y_te_t, n_classes)\n\n                if bits == 32 and sp == 0.0:\n                    base_ece_ref[cal] = ece_a\n                    experiment_data[cal][key][\"predictions\"] = (\n                        probs_after.detach().cpu().numpy()\n                    )\n\n                denom = ece_b - base_ece_ref[cal]\n                crr = (ece_b - ece_a) / denom if abs(denom) > 1e-8 else np.nan\n                if not np.isnan(crr):\n                    all_crr[cal].append(crr)\n\n                ece_after_grids[cal][bi, si] = ece_a\n\n                result = {\n                    \"bits\": bits,\n                    \"sparsity\": sp,\n                    \"compression_ratio\": compression_ratio,\n                    \"acc_before\": acc_b,\n                    \"ece_before\": ece_b,\n                    \"brier_before\": brier_b,\n                    \"acc_after\": acc_a,\n                    \"ece_after\": ece_a,\n                    \"brier_after\": brier_a,\n                    \"calibration_recovery_ratio\": crr,\n                }\n                result.update(params)\n                experiment_data[cal][key][\"compression_results\"].append(result)\n\n                if cal == \"temperature_scaling\":\n                    temp_reg_data[\"ratio\"].append(compression_ratio)\n                    temp_reg_data[\"T\"].append(params[\"temperature\"])\n                    temp_reg_data[\"dataset\"].append(key)\n\n                print(\n                    f\"[{key}][{cal}] bits={bits} sparsity={sp}: acc={acc_a:.4f} \"\n                    f\"ECE_before={ece_b:.4f} ECE_after={ece_a:.4f} CRR={crr:.3f}\"\n                )\n\n    ratios_arr = np.array(\n        [\n            r[\"compression_ratio\"]\n            for r in experiment_data[\"temperature_scaling\"][key][\"compression_results\"]\n        ]\n    )\n    temps_arr = np.array(\n        [\n            r[\"temperature\"]\n            for r in experiment_data[\"temperature_scaling\"][key][\"compression_results\"]\n        ]\n    )\n    coeffs = np.polyfit(ratios_arr, temps_arr, 1)\n    r2 = r_squared(ratios_arr, temps_arr, coeffs)\n    experiment_data[\"temperature_scaling\"][key][\"temp_regression_r2\"] = r2\n    print(f\"[{key}] Temperature ~ compression_ratio regression R^2 = {r2:.4f}\")\n\n    for cal in CALIBRATOR_NAMES:\n        crr_vals = np.array(\n            [\n                r[\"calibration_recovery_ratio\"]\n                for r in experiment_data[cal][key][\"compression_results\"]\n            ]\n        )\n        ratio_vals = np.array(\n            [\n                r[\"compression_ratio\"]\n                for r in experiment_data[cal][key][\"compression_results\"]\n            ]\n        )\n        mask = ~np.isnan(crr_vals)\n        if mask.sum() >= 3:\n            c = np.polyfit(ratio_vals[mask], crr_vals[mask], 1)\n            experiment_data[cal][key][\"crr_vs_compression_r2\"] = r_squared(\n                ratio_vals[mask], crr_vals[mask], c\n            )\n        plot_heatmap(\n            ece_after_grids[cal],\n            bits_list,\n            sparsity_list,\n            f\"{key}: ECE after {cal}\",\n            f\"{key}_ece_heatmap_after_{cal}.png\",\n        )\n\n    plot_heatmap(\n        ece_before_grid,\n        bits_list,\n        sparsity_list,\n        f\"{key}: ECE before calibration\",\n        f\"{key}_ece_heatmap_before.png\",\n    )\n\n# ---------------- Cross-dataset / cross-calibrator plots ----------------\nds_keys = [s[\"key\"] for s in dataset_specs]\n\nfor cal in CALIBRATOR_NAMES:\n    avg_crr = float(np.nanmean(all_crr[cal])) if len(all_crr[cal]) else float(\"nan\")\n    print(\n        f\"\\n=== [{cal}] Overall average calibration_recovery_ratio: {avg_crr:.4f} ===\"\n    )\n\nplt.figure(figsize=(8, 5))\nwidth = 0.25\nx = np.arange(len(ds_keys))\nfor i, cal in enumerate(CALIBRATOR_NAMES):\n    crr_means = []\n    for key in ds_keys:\n        vals = [\n            r[\"calibration_recovery_ratio\"]\n            for r in experiment_data[cal][key][\"compression_results\"]\n            if not np.isnan(r[\"calibration_recovery_ratio\"])\n        ]\n        crr_means.append(np.mean(vals) if vals else np.nan)\n    plt.bar(x + (i - 1) * width, crr_means, width, label=cal)\nplt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\nplt.xticks(x, ds_keys)\nplt.ylabel(\"Mean calibration_recovery_ratio\")\nplt.title(\"Calibrator comparison: recovery of compression-induced miscalibration\")\nplt.legend()\nplt.tight_layout()\nplt.savefig(os.path.join(working_dir, \"calibration_recovery_ratio_by_calibrator.png\"))\nplt.close()\n\nplt.figure()\ncolors = {\n    \"mnist\": \"tab:blue\",\n    \"fashion_mnist\": \"tab:orange\",\n    \"adult_income\": \"tab:green\",\n}\nfor key in ds_keys:\n    idx = [i for i, d in enumerate(temp_reg_data[\"dataset\"]) if d == key]\n    ratios = np.array(temp_reg_data[\"ratio\"])[idx]\n    temps = np.array(temp_reg_data[\"T\"])[idx]\n    plt.scatter(ratios, temps, label=key, color=colors[key], alpha=0.7)\nplt.xlabel(\"Compression ratio (bits/32 * (1-sparsity))\")\nplt.ylabel(\"Optimal temperature\")\nplt.title(\"Optimal temperature vs compression ratio\")\nplt.legend()\nplt.savefig(os.path.join(working_dir, \"temperature_vs_compression_ratio.png\"))\nplt.close()\n\n# ---------------- Save experiment data ----------------\nnp.save(os.path.join(working_dir, \"experiment_data.npy\"), experiment_data)\nprint(\"Saved experiment_data.npy and plots to working directory.\")\n", "import os\nimport copy\nimport numpy as np\nimport pandas as pd\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\n# --- Compatibility shim: newer pyarrow removed PyExtensionType, which the\n# `datasets` library references at class-definition time in features.py.\n# We never use Array2D/3D/4D/5D features, so aliasing to ExtensionType is\n# safe (only needed to satisfy the class statement, not instantiation).\nimport pyarrow as pa\n\nif not hasattr(pa, \"PyExtensionType\"):\n    pa.PyExtensionType = pa.ExtensionType\n\ndevice = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\nprint(f\"Using device: {device}\")\n\ntorch.manual_seed(0)\nnp.random.seed(0)\n\nORDERS = [\"prune_then_quantize\", \"quantize_then_prune\"]\nDATASET_KEYS = [\"mnist\", \"fashion_mnist\", \"adult_income\"]\n\n\ndef blank_dataset_entry():\n    return {\n        \"metrics\": {\"train\": [], \"val\": []},\n        \"losses\": {\"train\": [], \"val\": []},\n        \"predictions\": [],\n        \"ground_truth\": [],\n        \"compression_results\": [],\n        \"temp_regression_r2\": None,\n    }\n\n\nexperiment_data = {\n    order: {k: blank_dataset_entry() for k in DATASET_KEYS} for order in ORDERS\n}\n\n\n# ---------------- Dataset loaders ----------------\ndef load_image_dataset(hf_name, n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(hf_name, split=\"train\")\n        ds = ds.shuffle(seed=seed).select(range(min(n_samples, len(ds))))\n        imgs = np.stack([np.array(im, dtype=np.float32) / 255.0 for im in ds[\"image\"]])\n        labels = np.array(ds[\"label\"], dtype=np.int64)\n        return imgs.reshape(-1, 1, 28, 28), labels\n    except Exception as e:\n        print(\n            f\"HF image dataset '{hf_name}' load failed ({e}); falling back to synthetic image data\"\n        )\n        rng = np.random.RandomState(seed)\n        n_classes = 10\n        labels = rng.randint(0, n_classes, size=n_samples).astype(np.int64)\n        imgs = np.zeros((n_samples, 1, 28, 28), dtype=np.float32)\n        for i, lab in enumerate(labels):\n            base = rng.rand(28, 28).astype(np.float32) * 0.2\n            cy, cx = 6 + (lab % 5) * 4, 6 + (lab // 5) * 12\n            base[max(0, cy - 4) : cy + 4, max(0, cx - 4) : cx + 4] += 0.6\n            imgs[i, 0] = np.clip(base, 0, 1)\n        return imgs, labels\n\n\ndef load_tabular_dataset(n_samples=6000, seed=0):\n    try:\n        from datasets import load_dataset\n\n        ds = load_dataset(\"scikit-learn/adult-census-income\", split=\"train\")\n        df = ds.to_pandas()\n        target_col = \"income\" if \"income\" in df.columns else df.columns[-1]\n        y = (\n            df[target_col]\n            .astype(str)\n            .str.strip()\n            .str.contains(\">50K\")\n            .astype(int)\n            .values\n        )\n        X_df = df.drop(columns=[target_col]).fillna(0)\n        X_df = pd.get_dummies(X_df, dummy_na=True)\n        X = X_df.values.astype(np.float32)\n    except Exception as e:\n        print(\n            f\"HF tabular dataset load failed ({e}); falling back to synthetic classification data\"\n        )\n        from sklearn.datasets import make_classification\n\n        X, y = make_classification(\n            n_samples=8000,\n            n_features=20,\n            n_informative=10,\n            n_classes=2,\n            random_state=seed,\n        )\n        X = X.astype(np.float32)\n    rng = np.random.RandomState(seed)\n    idx = rng.choice(len(X), size=min(n_samples, len(X)), replace=False)\n    X, y = X[idx], y[idx]\n    X = (X - X.mean(0)) / (X.std(0) + 1e-6)\n    return X.astype(np.float32), y.astype(np.int64)\n\n\ndef make_splits(X, y, seed=0):\n    from sklearn.model_selection import train_test_split\n\n    X_tr, X_tmp, y_tr, y_tmp = train_test_split(\n        X, y, test_size=0.3, random_state=seed, stratify=y\n    )\n    X_val, X_te, y_val, y_te = train_test_split(\n        X_tmp, y_tmp, test_size=0.5, random_state=seed, stratify=y_tmp\n    )\n    return X_tr, y_tr, X_val, y_val, X_te, y_te\n\n\n# ---------------- Models ----------------\nclass TinyCNN(nn.Module):\n    def __init__(self, n_classes):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 8, 3, padding=1)\n        self.conv2 = nn.Conv2d(8, 16, 3, padding=1)\n        self.pool = nn.MaxPool2d(2, 2)\n        self.fc1 = nn.Linear(16 * 7 * 7, 32)\n        self.fc2 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = self.pool(F.relu(self.conv1(x)))\n        x = self.pool(F.relu(self.conv2(x)))\n        x = x.view(x.size(0), -1)\n        x = F.relu(self.fc1(x))\n        return self.fc2(x)\n\n\nclass TinyMLP(nn.Module):\n    def __init__(self, in_dim, n_classes):\n        super().__init__()\n        self.fc1 = nn.Linear(in_dim, 64)\n        self.fc2 = nn.Linear(64, 32)\n        self.fc3 = nn.Linear(32, n_classes)\n\n    def forward(self, x):\n        x = F.relu(self.fc1(x))\n        x = F.relu(self.fc2(x))\n        return self.fc3(x)\n\n\n# ---------------- Calibration utilities ----------------\ndef compute_ece(probs, labels, n_bins=15):\n    confidences, preds = probs.max(1)\n    accuracies = (preds == labels).float()\n    ece = torch.zeros(1, device=probs.device)\n    bin_boundaries = torch.linspace(0, 1, n_bins + 1, device=probs.device)\n    for i in range(n_bins):\n        lo, hi = bin_boundaries[i], bin_boundaries[i + 1]\n        in_bin = (confidences > lo) & (confidences <= hi)\n        prop = in_bin.float().mean()\n        if prop.item() > 0:\n            acc_bin = accuracies[in_bin].mean()\n            conf_bin = confidences[in_bin].mean()\n            ece += prop * torch.abs(acc_bin - conf_bin)\n    return ece.item()\n\n\ndef compute_brier(probs, labels, n_classes):\n    onehot = F.one_hot(labels, n_classes).float()\n    return ((probs - onehot) ** 2).sum(1).mean().item()\n\n\ndef fit_temperature(logits, labels, max_iter=50):\n    logT = torch.zeros(1, device=logits.device, requires_grad=True)\n    opt = torch.optim.LBFGS([logT], lr=0.05, max_iter=max_iter)\n    nll = nn.CrossEntropyLoss()
