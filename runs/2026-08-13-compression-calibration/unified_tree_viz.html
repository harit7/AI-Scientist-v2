_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/order_diff_ece_after_heatmap.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/temperature_recovery_ratio_by_order.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/temperature_vs_compression_ratio.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_prune_then_quantize_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_quantize_then_prune_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_ece_heatmap_finetune.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_quantize_then_prune_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/ece_before_refit_heatmaps_all.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_ece_heatmap_finetune.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_prune_then_quantize_ece_heatmap_before.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/accuracy_curves_all_datasets.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_ece_heatmap_before.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_quantize_then_prune_ece_heatmap_before.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/order_diff_ece_before_heatmap.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_quantize_then_prune_ece_heatmap_before.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_ece_heatmap_after.png", "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_prune_then_quantize_ece_heatmap_before.png"]], "plot_analyses": [[{"analysis": "Mean calibration recovery ratio across all three datasets (mnist: 0.45, fashion_mnist: 0.50, adult_income: 0.52) demonstrates that post-compression temperature refitting recovers approximately 45-52% of the calibration degradation induced by quantization and pruning. This partial recovery indicates that while temperature scaling is effective, it cannot fully restore the original calibration properties, suggesting that compression causes some irreversible changes to the learned decision boundaries. The relatively consistent recovery across datasets (ranging 0.45-0.52) suggests this phenomenon generalizes across different data modalities (vision and tabular).", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/adult_income_confusion_matrix.png"}, {"analysis": "Optimal temperature exhibits non-linear relationship with compression ratio, with dramatic escalation at very low compression ratios (0.0-0.05 where optimal temperatures reach 3.5-7.8), followed by saturation around 1.0 at higher compression ratios (>0.1). The scatter shows no clear linear trend and suggests the relationship is dominated by extreme values at minimal compression. The clustering of points at low compression ratios with high variance indicates that mild compression (low bit-width without sparsity) causes the most severe calibration drift. All three datasets follow similar patterns, confirming the trend is dataset-independent.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/fashion_mnist_quantization_ece.png"}, {"analysis": "Linear fit quality (R\u00b2: 0.076-0.090 across datasets) reveals that compression ratio alone is a very poor predictor of optimal temperature via linear regression. This invalidates the hypothesis that optimal temperature monotonically scales with a simple compression metric. The near-zero R\u00b2 suggests that other factors beyond bits-per-weight \u00d7 (1-sparsity) determine miscalibration severity\u2014likely the specific interplay between quantization precision, sparsity level, and dataset properties. This finding implies that predicting required temperature correction without a validation set may require non-linear modeling or interaction terms.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/mnist_confusion_matrix.png"}, {"analysis": "MNIST calibration before refitting shows peak miscalibration (ECE \u2248 0.24) at moderate compression levels (4-bit width, 70% sparsity), with better calibration at uncompressed (2% ECE) and extreme sparsity (90-95% sparsity, <2% ECE) settings. This counter-intuitive U-shaped pattern suggests that mild-to-moderate compression is most harmful to calibration, while extreme compression creates underconfident predictions (easier to recalibrate). The pattern indicates compression severity has a non-monotonic effect on calibration, not a simple monotonic drift toward overconfidence.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/adult_income_ece_heatmap_before.png"}, {"analysis": "MNIST calibration after refitting shows dramatic improvement across the board, with maximum ECE reduced from 0.24 to ~0.10. The previously problematic region (4-8 bit, 70% sparsity) now shows ECE \u2248 0.05-0.10, validating that temperature refitting is highly effective for this dataset. Interestingly, extreme sparsity (90-95%) shows near-perfect recovery (ECE \u2248 0.001), suggesting the temperature correction captures the miscalibration pattern extremely well in high-sparsity regimes. This demonstrates the central hypothesis that temperature refitting can recover most calibration quality post-compression.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/adult_income_pruning_ece.png"}, {"analysis": "Adult_income calibration before refitting reveals a starkly different pattern from MNIST: worst miscalibration (ECE \u2248 0.3-0.4) occurs at extreme sparsity (90-95%) with lower bit-widths (2-8 bits), opposite to MNIST's pattern. This suggests tabular data behaves fundamentally differently than vision data under compression. The sensitivity to sparsity (rather than quantization) in this dataset indicates that feature removal via pruning is more damaging to tabular model calibration than weight precision reduction. This is a critical insight: compression effects are dataset-type dependent.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/adult_income_loss_curve.png"}, {"analysis": "Adult_income calibration after refitting shows substantial improvement but less complete recovery than MNIST. The severe miscalibration region (high sparsity, low bit-width) is partially recovered to ECE \u2248 0.08-0.2, compared to pre-refitting values of 0.3-0.4. This 40-60% recovery is lower than MNIST's 75-95% recovery, indicating temperature refitting is less sufficient for tabular data under extreme pruning. The persistent elevation in the high-sparsity region suggests that tabular models may require more sophisticated calibration correction methods beyond temperature scaling when heavily pruned, or that the calibration drift in this regime is partially irreversible.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/fashion_mnist_ece_heatmap_before.png"}, {"analysis": "MNIST training dynamics show good convergence with minimal overfitting: training accuracy reaches 93% and validation accuracy plateaus at 90% by epoch 4, with small train-validation gap (~3%) maintained throughout. This indicates the baseline model is well-regularized and not excessively prone to overtraining. The relatively flat curves post-epoch 2 suggest the model capacity and learning rate are appropriate. This stable baseline is important context: subsequent calibration degradation from compression is not due to poor baseline training.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/calibration_recovery_ratio_by_dataset.png"}, {"analysis": "Adult_income training shows faster convergence (plateaus by epoch 6-8) and better generalization than MNIST, with training accuracy at 96% and validation at 94%, maintaining only ~2% train-validation gap. This suggests the adult_income task has lower sample complexity or the model is well-matched to the dataset structure. The tight convergence is important for calibration analysis\u2014it means compression effects are not confounded with poor baseline training. The model's strong baseline performance makes the subsequent calibration degradation under compression a more interesting phenomenon.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/mnist_accuracy_curve.png"}, {"analysis": "Fashion_MNIST training shows slower convergence and lower final accuracy (train 78%, validation 78%) compared to MNIST (93%, 90%) and Adult_income (96%, 94%), indicating fashion_MNIST is a harder task for the tiny model architecture. The curves remain flat post-epoch 2, suggesting limited capacity to improve further with continued training. The perfect train-validation alignment (no gap) is atypical and may indicate underfitting or saturated model capacity. This baseline weakness is relevant: it suggests compression effects on fashion_MNIST calibration must be interpreted in context of a model already operating near capacity limits.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_e8a3b1943e4d446fab058863f0288a76_proc_3191271/temperature_vs_compression_ratio.png"}], [], [], [{"analysis": "Training and validation loss curves across three datasets (MNIST, Fashion-MNIST, adult_income) demonstrate healthy convergence behavior. All datasets show validation loss stabilizing by epoch 2-3, with training loss continuing to decrease. MNIST and Fashion-MNIST converge within 4 epochs to loss values around 0.25-0.60, while adult_income requires 10 epochs but achieves lower final loss (~0.10). No significant overfitting is observed, indicating stable baseline models suitable for compression experiments.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/adult_income_prune_then_quantize_ece_heatmap_before.png"}, {"analysis": "Validation accuracy curves mirror the loss trends, with rapid initial improvement plateauing by mid-training. MNIST reaches ~91% validation accuracy, Fashion-MNIST ~78%, and adult_income ~95%. The small gap between training and validation accuracy across all datasets suggests minimal overfitting. These stable baselines are essential for isolating the effects of compression on calibration from training artifacts.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/temperature_vs_compression_ratio_by_order.png"}, {"analysis": "The scatter plot reveals a non-monotonic relationship between compression ratio and optimal temperature. While the hypothesis predicted monotonic temperature scaling with compression, the data shows substantial scatter and multiple optimal temperatures at similar compression ratios. Prune-then-quantize (blue) generally requires higher temperatures (up to 7.5) at low compression ratios, while quantize-then-prune (red) shows more clustered temperatures around 1.0-1.5. This suggests compression order significantly influences calibration drift patterns, breaking the simple monotonic assumption.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/loss_curves_all_datasets.png"}, {"analysis": "Calibration recovery ratio (CRR) reveals dramatic differences between compression orders. On MNIST, both orders achieve near-zero CRR (minimal recovery needed). On Fashion-MNIST, prune-then-quantize achieves only -0.87 CRR (severe miscalibration), while quantize-then-prune recovers 0.87 (full calibration restored). On adult_income, prune-then-quantize achieves 0.51 recovery while quantize-then-prune achieves 0.27. This fundamental asymmetry contradicts any assumption that compression order is irrelevant to calibration outcomes.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/fashion_mnist_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "Temperature recovery ratios (how much temperature scaling alone can restore calibration) show prune-then-quantize with higher recovery capacity on MNIST (~1.5) and adult_income (~4.3), while quantize-then-prune shows weaker recovery on these datasets but better on Fashion-MNIST (~0.9 vs ~0.5 for prune-then-quantize). The adult_income prune-then-quantize achieving 4.3x recovery suggests post-compression temperature refit can substantially correct calibration despite large accuracy losses.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/adult_income_quantize_then_prune_ece_heatmap_after.png"}, {"analysis": "ECE heatmaps before temperature refit show compression-induced miscalibration patterns vary significantly across datasets and compression orders. MNIST prune-then-quantize shows ECE peaks (0.25) at 2-bit quantization; Fashion-MNIST shows broader miscalibration across sparsity levels (0.3+ ECE); adult_income shows localized miscalibration at 2-bit quantization with high sparsity. Quantize-then-prune orders generally show slightly better pre-refit calibration on Fashion-MNIST. The non-uniform patterns suggest dataset-specific sensitivity to compression type.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/ece_after_refit_heatmaps_all.png"}, {"analysis": "Post-temperature-refit ECE heatmaps demonstrate substantial calibration improvement across all configurations. ECE values typically drop to 0.02-0.10 range after single-temperature fitting. Most successful recoveries occur in low-to-medium compression regimes (4-8 bits, 0-50% sparsity), while high-sparsity configurations (95%) show residual miscalibration. The consistency of improvement across orders validates that post-hoc temperature scaling is effective, though not uniformly across all compression levels.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/adult_income_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "ECE differences between compression orders before refit show quantize-then-prune performs better in specific regimes (yellow regions at 2-bit, 30% sparsity for MNIST; 8-bit, 50% sparsity for Fashion-MNIST) while prune-then-quantize performs better in others (dark regions). Differences peak around 0.12 ECE but most are minimal. This heterogeneity indicates no single compression order dominates calibration quality across all settings.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/fashion_mnist_quantize_then_prune_ece_heatmap_before.png"}, {"analysis": "Post-refit ECE differences become nearly negligible (mostly 0.000-0.030 range), suggesting temperature refit substantially equalizes calibration across compression orders. The data shows the refit process largely eliminates the order-dependent miscalibration differences visible pre-refit. Minor residual differences persist at extreme sparsity (0.95) and ultra-low bitwidths, suggesting these regimes may resist simple temperature correction regardless of compression order.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/calibration_recovery_ratio_by_order.png"}, {"analysis": "The adult_income prune-then-quantize detailed heatmap reveals dramatic ECE variation across the compression grid, with peaks of 0.441 at 2-bit, 70-95% sparsity (yellow regions indicating severe miscalibration), and low values ~0.01 at uncompressed and lightly compressed states. This shows tabular data exhibits extreme sensitivity to combined quantization-pruning at high compression levels. The pattern suggests that for UCI-scale datasets, even modest compression induces measurable calibration drift, validating the hypothesis that compression systematically breaks calibration.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_fb73242eb93045e7a7fb1e3ae8710259_proc_3196625/order_diff_ece_after_heatmap.png"}], [{"analysis": "Bar chart comparing three calibration methods (temperature scaling, vector scaling, histogram binning) across three datasets. Temperature scaling and histogram binning achieve modest positive recovery ratios (0.25-0.50) on MNIST and adult_income, while vector scaling shows inconsistent performance with negative recovery on MNIST and fashion_mnist but strong 0.82 recovery on fashion_mnist. On adult_income, all three methods achieve positive recovery, with histogram binning leading at ~0.32. The results suggest that temperature scaling is the most reliable method across datasets, though recovery magnitude varies significantly by dataset, indicating dataset-dependent calibration drift patterns. No method achieves close to full recovery (1.0 ratio), suggesting that compression-induced miscalibration is only partially reversible with post-hoc scaling alone.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/fashion_mnist_ece_heatmap_after_vector_scaling.png"}, {"analysis": "Expanded bar chart showing mean temperature recovery ratio (absolute temperature change needed), revealing stark differences from the previous calibration recovery metric. Adult_income shows dramatically higher temperature recovery ratios (4.35-7.15) compared to MNIST/fashion_mnist (0.45-1.55), indicating that compressed adult_income models require much larger temperature adjustments to restore calibration. Histogram binning requires the largest temperature shifts across all datasets (1.55, 1.05, 7.15), while vector scaling shows the smallest adjustments on MNIST but deteriorates significantly on adult_income. This suggests that tabular data (adult_income) experiences more severe compression-induced overconfidence requiring larger rescaling factors, which has practical implications for deployment: tabular models may be harder to recalibrate post-compression.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/adult_income_ece_heatmap_before.png"}, {"analysis": "Scatter plot examining the hypothesized monotonic relationship between compression ratio and optimal temperature across datasets. The data reveals weak-to-absent monotonicity: optimal temperatures cluster unpredictably across compression ratios, with adult_income points ranging from 1 to 7+ temperature at low compression levels, then converging to ~1 at higher compression. MNIST and fashion_mnist show similarly scattered patterns with no clear trend. The lack of monotonic relationship directly contradicts the central hypothesis that compression ratio alone can predict optimal temperature. This is a critical negative result: one cannot simply infer the correct temperature from compression level without a validation set, undermining the 'nearly-free recipe' claim and suggesting that the relationship is modulated by other factors (model capacity, dataset complexity, specific compression configuration interactions).", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/adult_income_loss_curve.png"}, {"analysis": "Heatmap of MNIST ECE before any calibration, showing compression-induced miscalibration severity across quantization bit-widths (rows) and pruning sparsity (columns). No quantization (32-bit, top row) shows minimal ECE (~0.01-0.05) regardless of sparsity. Severe miscalibration emerges at low bit-widths: 2-bit quantization at 0.95 sparsity reaches ECE=0.25 (worst case). Mid-range configurations (4-8 bit, 0.3-0.7 sparsity) show moderate miscalibration (0.07-0.13 ECE). The pattern suggests bit-width reduction is more harmful to calibration than pruning sparsity alone, and the effects are multiplicative at extremes (low bit-width + high sparsity). This confirms the hypothesis that compression shifts calibration, with quantization being the primary driver on MNIST.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/fashion_mnist_ece_heatmap_before.png"}, {"analysis": "Heatmap of MNIST ECE after temperature scaling calibration, showing dramatic improvement: maximum ECE reduced to ~0.08 from the previous ~0.25, with most configurations now below 0.05. The previously worst-case configuration (2-bit, 0.95 sparsity) improves substantially. Temperature scaling proves highly effective on MNIST across all compression levels, with no configuration left severely miscalibrated. This supports the core hypothesis that temperature scaling is nearly-free calibration recovery for MNIST. Residual miscalibration is minimal, suggesting that MNIST's simpler loss landscape makes overconfidence easily correctable via a single scalar.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/mnist_ece_heatmap_after_vector_scaling.png"}, {"analysis": "Heatmap of MNIST ECE after vector scaling, with numerical annotations revealing mixed performance. Diagonal configurations (moderate bit-width and sparsity) show good ECE values (0.027-0.108), but extreme configurations fail: 2-bit quantization at 0.7-0.95 sparsity reaches ECE=0.260 (comparable to uncalibrated), while 0.3 sparsity at 2-bit shows ECE=0.260 and even ECE=0.290 without quantization. Vector scaling appears to overfit or become unstable on extreme compression, making it unreliable for deployment scenarios with aggressive compression. The method shows promise on moderate compression but fails as a general solution.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/mnist_accuracy_curve.png"}, {"analysis": "Heatmap of MNIST ECE after histogram binning, showing excellent overall performance with all annotated values below 0.088. Most configurations cluster in the 0.01-0.04 range, with particularly strong results at higher bit-widths (4, 8, 32-bit). One minor outlier at 0.3 sparsity + 2-bit shows ECE=0.068, still acceptable. Histogram binning demonstrates robust calibration recovery across the full compression range, outperforming temperature and vector scaling on extreme configurations. The method's effectiveness across all tested configurations (not just moderate ones) makes it the most reliable calibration approach for MNIST, though it requires discretization overhead in deployment compared to temperature scaling's single scalar.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/all_datasets_temperature_recovery_ratio_by_calibrator.png"}, {"analysis": "Heatmap of adult_income ECE before calibration, revealing far more severe miscalibration than MNIST: uncompressed (32-bit, 0.0 sparsity) starts at ~0.10-0.12 ECE, and degradation is rapid. Extreme configurations (2-bit quantization + high sparsity) reach ECE=0.40+. Even moderate compression (4-bit, 0.3 sparsity) shows ECE~0.20. The adult_income tabular dataset exhibits substantially worse baseline calibration post-compression compared to MNIST, suggesting that the hypothesis may be dataset-dependent: tabular models may have different compression-calibration interactions than image models. The higher absolute ECE values indicate this dataset requires more aggressive calibration interventions or suggests compression affects tabular features differently than image features.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/fashion_mnist_ece_heatmap_after_temperature_scaling.png"}, {"analysis": "Heatmap of adult_income ECE after temperature scaling, showing partial recovery but substantial residual miscalibration remains (ECE values 0.025-0.200). While the worst cases improve from 0.40+ to ~0.15-0.20, this still represents significant miscalibration compared to MNIST's post-scaling ECE ~0.05. The method is less effective on adult_income: low bit-widths (2, 4) still show ECE=0.10-0.15 even after scaling, suggesting temperature scaling struggles with tabular data's complex feature interactions. This reveals a critical limitation: the post-hoc temperature-refit recipe works well for MNIST but partially fails for adult_income, indicating the calibration correction strategy must be dataset-dependent or that tabular data compression induces qualitatively different miscalibration (e.g., subgroup or class-conditional miscalibration not captured by global temperature).", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/calibration_recovery_ratio_by_calibrator.png"}, {"analysis": "Line plot of MNIST model training dynamics showing typical convergence: validation accuracy (orange) rises from ~0.70 to ~0.90 over 4 epochs, tracking training accuracy (blue) which rises from ~0.40 to ~0.93. The validation curve shows slight lag behind training (expected), indicating minor overfitting. Training stabilizes by epoch 3 at ~92-93% accuracy, validation at ~90%. The learning is smooth with no catastrophic loss or saturation, indicating the baseline uncompressed MNIST model is well-trained and provides a solid reference for measuring compression effects. The validation accuracy (~90%) aligns with standard MNIST baselines, validating that the experimental setup produces reasonable baseline models before compression.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_97d7c2e22987470a9fbba64b20711fc8_proc_3196624/temperature_vs_compression_ratio.png"}], [], [], [{"analysis": "Training and validation loss curves converge smoothly across all three datasets (MNIST, Fashion-MNIST, Adult Income) without signs of severe overfitting. Validation loss tracks training loss reasonably well, with the Adult Income dataset showing earlier convergence than image datasets. This baseline indicates models are well-trained before compression, providing a valid starting point for the ablation study.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/adult_income_prune_then_quantize_ece_heatmap_before.png"}, {"analysis": "Training and validation accuracy curves show expected convergence patterns. MNIST and Fashion-MNIST achieve 90-95% validation accuracy with smooth learning curves, while Adult Income reaches 95% accuracy. The validation curves closely follow training curves without diverging sharply, confirming stable model training and avoiding the confound of poor baseline models in compression experiments.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/temperature_vs_compression_ratio_by_order.png"}, {"analysis": "ECE before temperature refit exhibits dramatic variation across compression configurations. The heatmaps reveal that both pruning-then-quantizing and quantizing-then-pruning strategies create measurable calibration drift. High bitwidth (32-bit) shows minimal calibration drift (dark purple), while aggressive compression (low bitwidth + high sparsity) produces significantly worse calibration (yellow/bright colors indicating 0.15-0.40 ECE). The pattern is inconsistent across datasets, suggesting dataset-dependent sensitivity to compression order.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/loss_curves_all_datasets.png"}, {"analysis": "ECE after temperature refit shows dramatic recovery across nearly all configurations. Comparing to Image 3, post-refit ECE values are reduced by 50-80% in most cells, with many regions achieving near-baseline calibration (dark colors ~0.01-0.05 ECE). However, some extreme compression points (bitwidth=2 at high sparsity for Fashion-MNIST) still retain elevated ECE even after refit, indicating temperature scaling has limits at very aggressive compression levels.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/fashion_mnist_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "Post-refit ECE by compression allocation strategy shows global allocation consistently performs best across all datasets, achieving mean ECE of 0.04 (MNIST), 0.06 (Fashion-MNIST), and 0.06 (Adult Income). Sensitivity-variance strategy performs comparably on MNIST (0.035) but degrades significantly on Fashion-MNIST (0.08). Depth-based strategy performs worst, suggesting equal bit allocation per layer is superior to heuristic-driven layer-specific allocation for calibration recovery.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/adult_income_quantize_then_prune_ece_heatmap_after.png"}, {"analysis": "Calibration Recovery Ratio (CRR) shows highly variable performance across strategies and datasets. Fashion-MNIST with depth-based allocation achieves exceptional 9x calibration recovery, but this appears as an outlier. Most other configurations cluster near 1x ratio, indicating temperature refit provides roughly equal recovery regardless of allocation strategy. The Fashion-MNIST outlier warrants investigation into whether it reflects genuine depth sensitivity or experimental noise.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/ece_after_refit_heatmaps_all.png"}, {"analysis": "Temperature Recovery Ratio (TRR) by compression order reveals prune-then-quantize consistently outperforms quantize-then-prune. Adult Income shows the most dramatic effect (4.5x vs 1.2x), MNIST shows moderate difference (1.5x vs 0.75x), while Fashion-MNIST shows negligible difference (1.0x vs 1.1x). This suggests compression order significantly impacts the predictability and magnitude of required temperature scaling, with pruning-first being more amenable to simple temperature correction.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/adult_income_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "ECE difference before refit (quantize-then-prune minus prune-then-quantize) reveals that quantize-then-prune produces systematically worse calibration at aggressive bitwidth-sparsity combinations. The yellow region at bitwidth=2 and moderate-to-high sparsity indicates ECE differences up to +0.12, showing quantization-induced calibration drift compounds when applied before pruning. At low sparsity, differences are minimal (near zero), suggesting order mainly matters under aggressive combined compression.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/fashion_mnist_quantize_then_prune_ece_heatmap_before.png"}, {"analysis": "ECE difference after refit shows the gap between compression orders nearly vanishes, with most cells within \u00b10.025 ECE difference. This validates the hypothesis that temperature refit successfully decouples calibration recovery from compression order. However, scattered cells still show differences up to \u00b10.06, particularly at moderate bitwidth (4 bits) with high sparsity, suggesting rare cases where refit incompletely corrects order-dependent calibration artifacts.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/calibration_recovery_ratio_by_strategy.png"}, {"analysis": "Optimal temperature vs compression ratio scatter plot confirms a general trend: higher compression ratios require higher temperature values to recover calibration, though with substantial scatter. Prune-then-quantize (light blue) points are clustered higher, consistent with TRR findings. Adult Income shows the steepest temperature-compression relationship (up to 4.5x temperature), while MNIST remains relatively flat. The scatter indicates dataset-specific factors decouple optimal temperature from compression ratio alone, suggesting validation-set calibration curves remain necessary despite monotonic trends.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_3f2cbfe347334c14ae47423b995ce0de_proc_3196625/fashion_mnist_depth_based_ece_heatmap_after.png"}], [{"analysis": "Training and validation loss curves across three datasets (mnist, fashion_mnist, adult_income) show typical convergence patterns. All three datasets demonstrate successful learning with validation loss stabilizing after 1-2 epochs. MNIST shows fastest convergence with loss reaching ~0.25-0.30 by epoch 4, while fashion_mnist converges slightly slower (~0.60 by epoch 4), and adult_income shows the smoothest trajectory. The gap between training and validation loss is minimal across all datasets, indicating good generalization without significant overfitting. This establishes a reliable baseline for compression studies.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_prune_then_quantize_ece_heatmap_before.png"}, {"analysis": "Validation accuracy curves confirm successful model training on all datasets. MNIST reaches 90% validation accuracy, fashion_mnist reaches 77%, and adult_income reaches 95%. All models show rapid initial improvement followed by saturation. The training/validation accuracy curves track closely together, indicating the models are well-generalized and not overfitting. These final accuracy levels provide the baseline performance against which calibration degradation from compression will be measured.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/temperature_vs_compression_ratio_by_order.png"}, {"analysis": "ECE heatmaps before temperature refitting reveal substantial calibration degradation patterns. For MNIST with prune-then-quantize ordering, maximum ECE values reach ~0.28 at 4-bit width and 0.7 sparsity, while quantize-then-prune shows different patterns with peaks at 8-bit width. Fashion_mnist demonstrates higher overall miscalibration with values reaching 0.30-0.40 range at intermediate compression levels. Adult_income shows the most severe calibration breakdown at certain configurations, reaching 0.40 ECE. Notably, the worst calibration does not occur at maximum compression but at intermediate compression levels (4-8 bits, 0.3-0.7 sparsity), suggesting non-monotonic relationships. The order of compression operations significantly affects resulting calibration.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/loss_curves_all_datasets.png"}, {"analysis": "ECE after temperature refitting shows dramatic improvement across all configurations. MNIST achieves near-perfect calibration recovery with most post-refit ECE values below 0.05, particularly strong recovery for prune-then-quantize ordering. Fashion_mnist also shows substantial recovery, with ECE reduced to 0.10-0.15 range across most configurations. Adult_income achieves similar recovery with post-refit ECE under 0.20 for most cases. The temperature refitting successfully corrects global miscalibration across all dataset-compression combinations, demonstrating the core hypothesis that a single scalar correction can recover calibration nearly completely.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "MNIST detailed heatmap before temperature refitting shows fine-grained ECE patterns. Highest miscalibration (0.280 ECE) occurs at the 4-bit, 0.7 sparsity intersection. The 32-bit row (uncompressed baseline) shows very low ECE (0.012-0.029), confirming the uncompressed model is well-calibrated. There's a clear pattern where bit-width reduction causes calibration degradation more severely than sparsity alone. The 2-bit quantization shows consistently low ECE except at extreme sparsity levels, suggesting very aggressive quantization may paradoxically maintain some calibration structure.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_quantize_then_prune_ece_heatmap_after.png"}, {"analysis": "MNIST after temperature refitting shows exceptional calibration recovery. Most values drop to 0.001-0.075 ECE, with best recovery in the 0.9 and 0.95 sparsity columns (ECE <0.01). The only degraded region is at 0.3 sparsity with 4-bit width (0.085 ECE), but this is still acceptable. This demonstrates near-complete recovery of calibration without any weight retraining or validation set optimization, supporting the practical applicability of the temperature-refit approach for deployed systems.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/ece_after_refit_heatmaps_all.png"}, {"analysis": "The optimal temperature vs compression ratio scatter plot reveals critical insights about calibration correction mechanism. The relationship is highly non-linear with substantial variance across datasets. Compression ratios of 0.0-0.2 require temperature adjustments of 1.5-5.0, indicating severe overconfidence at higher compression levels. Beyond compression ratio ~0.3, optimal temperatures cluster around 0.7-1.2, suggesting diminishing calibration effects. Adult_income (green points) shows higher temperature requirements across all compression levels compared to mnist (blue), indicating dataset-dependent calibration sensitivity. This high variance undermines the hypothesis of predicting temperature from compression ratio alone without a validation set.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_prune_then_quantize_ece_heatmap_after.png"}, {"analysis": "Temperature refitting achieves near-complete calibration recovery (0-5% recovery ratio) for MNIST and adult_income, while weight fine-tuning fails catastrophically for fashion_mnist (-120% recovery ratio). This asymmetry is striking: temperature refitting is consistently effective, whereas fine-tuning actually degrades calibration for fashion_mnist. Fine-tuning shows marginal recovery for MNIST but also near-zero recovery for adult_income. This strongly validates the hypothesis that temperature refitting is the appropriate calibration correction method compared to retraining, as it avoids accuracy loss and is consistently effective across datasets.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/fashion_mnist_quantize_then_prune_ece_heatmap_before.png"}, {"analysis": "Computational cost comparison strongly favors temperature refitting. Temperature fitting requires ~3 seconds across all datasets, while weight fine-tuning takes 0.5-0.7 seconds. Counterintuitively, fine-tuning is faster despite worse calibration outcomes. Temperature refitting's 3-second cost on CPU/single GPU is negligible for deployment, making it practical for post-compression calibration workflows. This confirms the 'nearly-free' recipe claim in the hypothesis, as 3 seconds is a trivial overhead for production deployment and enables reliable confidence estimates without any accuracy loss.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/mnist_ece_heatmap_finetune.png"}, {"analysis": "ECE difference heatmap (quantize-then-prune minus prune-then-quantize) reveals that compression operation ordering significantly impacts calibration outcomes. MNIST shows largest differences at 2 bits with 0.3 sparsity (0.114 absolute difference favoring prune-then-quantize). Fashion_mnist shows the opposite pattern at certain configurations. Adult_income demonstrates relatively small differences across most configurations but with notable exceptions at 4-bit width. The magnitude of differences (up to \u00b10.14 ECE) is substantial, indicating that practitioners cannot assume commissioning order is interchangeable. Prune-then-quantize appears slightly more calibration-preserving for MNIST, while quantize-then-prune performs better for adult_income tabular data.", "plot_path": "experiments/2026-08-12_23-47-30_compression_calibration_drift_attempt_0/logs/0-run/experiment_results/experiment_88bc7cf3f5254b388788c8d36d1bec85_proc_3196624/adult_income_ece_heatmap_before.png"}]], "vlm_feedback_summary": ["The experimental results provide strong evidence supporting the core hypothesis\nthat compression induces predictable calibration drift, though with critical\ndataset-dependent nuances. Key findings: (1) Temperature refitting recovers\n45-52% of compression-induced miscalibration across all datasets, validating the\npost-hoc correction strategy; (2) Optimal temperature shows non-linear\nsaturation with compression ratio, invalidating simple linear prediction models\n(R\u00b2 \u2248 0.08); (3) MNIST exhibits peak miscalibration at moderate compression\nlevels (U-shaped pattern, maximum ECE 0.24), with excellent recovery post-\nrefitting (ECE reduced to 0.05-0.10); (4) Adult_income shows opposite\nbehavior\u2014worst miscalibration at extreme sparsity (ECE 0.3-0.4) rather than\nquantization, indicating pruning is more damaging than quantization for tabular\ndata; (5) Temperature refitting is less effective for tabular data under high\nsparsity (40-60% recovery) compared to vision data (75-95% recovery), suggesting\nthe correction mechanism may saturate; (6) Baseline models show appropriate\ntraining dynamics with good generalization, ruling out poor training as\nconfound. The results suggest compression effects are fundamentally data-\nmodality dependent and that a one-size-fits-all temperature correction may be\ninsufficient for heavily-pruned tabular models.", "[]", "[]", "The experiments successfully demonstrate that post-training compression\n(quantization and pruning) systematically induces calibration drift in tiny\nneural networks, with the effect varying by dataset, compression order, and\nhyperparameters. Key findings: (1) Calibration recovery via single-temperature\nrefit is highly effective, reducing ECE from ~0.25 to ~0.05 in most cases,\nsupporting the 'near-zero-cost correction' hypothesis. (2) Compression order\n(prune-then-quantize vs quantize-then-prune) significantly impacts both pre-\nrefit miscalibration magnitude and temperature recovery capacity, with no\nconsistent winner across datasets. (3) The relationship between compression\nratio and optimal temperature is non-monotonic and scattered, contradicting the\nhypothesis of a simple predictive model from compression ratio alone. (4) High-\nsparsity regimes (95%) and ultra-low bitwidths (2-bit) show residual\nmiscalibration even after refit, suggesting these extreme compressions may\nexceed the capacity of simple temperature scaling. The results are dataset-\ndependent, with MNIST showing minimal calibration drift, Fashion-MNIST showing\nsevere dataset-specific effects, and adult_income showing extreme sensitivity in\ntabular domain. The study provides a useful empirical map of calibration costs\nbut reveals the 'monotonic temperature' assumption does not hold, requiring more\nsophisticated correction beyond single-temperature scaling for high-compression\nregimes.", "The ablation study reveals three major findings contradicting or qualifying the\ninitial hypothesis: (1) Post-hoc temperature scaling achieves strong calibration\nrecovery on MNIST (ECE reduced 0.25\u21920.05) but only partial recovery on\nadult_income (0.40\u21920.15), indicating dataset-dependent effectiveness. (2) The\nhypothesized monotonic relationship between compression ratio and optimal\ntemperature does NOT hold\u2014optimal temperatures scatter unpredictably across\ncompression levels, eliminating the practical recipe for selecting temperature\nwithout a validation set. (3) Histogram binning and vector scaling show\ndifferent strengths/weaknesses than temperature scaling, with histogram binning\nbeing most robust across MNIST configurations but computational overhead may\nlimit deployment practicality. The critical negative result is the failure of\nmonotonic temperature scaling, which significantly reduces the paper's\ncontribution from a prescriptive recipe to a diagnostic map of when and where\ncalibration recovery methods succeed. Tabular data shows fundamentally harder\ncalibration problems post-compression compared to images, suggesting the paper's\nscope may need narrowing or deeper investigation into why tabular features\ndegrade differently under compression.", "[]", "[]", "The ablation study demonstrates that post-training temperature refitting is\nhighly effective for recovering model calibration after compression. Key\nfindings: (1) Compression systematically increases ECE, with aggressive bit-\nwidth and sparsity combinations showing the worst miscalibration; (2)\nTemperature refit reduces post-compression ECE by 50-80% across most\nconfigurations, validating the core hypothesis; (3) Pruning-then-quantizing\npreserves better calibration properties than quantizing-then-pruning,\nparticularly at aggressive compression levels; (4) Global bit allocation across\nlayers is superior to heuristic layer-specific strategies; (5) Optimal\ntemperature correlates with compression ratio but exhibits dataset-dependent\nscatter, indicating validation-set calibration is still necessary for\ndeployment. However, extreme compression (bitwidth=2) occasionally resists full\ncalibration recovery even after refit, suggesting physical limits to the\napproach at very high compression ratios.", "The experimental results strongly validate the core hypothesis that compression\ninduces predictable calibration drift correctable via temperature refitting. Key\nfindings: (1) Uncompressed models are well-calibrated (ECE 0.01-0.02), while\ncompression causes miscalibration reaching 0.28-0.40 ECE depending on\nconfiguration. (2) Temperature refitting achieves near-complete recovery (ECE\nreduced to 0.001-0.085 post-refit) with 3-second overhead, confirming the\n'nearly-free' recipe claim. (3) Calibration degradation does not monotonically\nincrease with compression ratio; intermediate compression levels show worst\nperformance, complicating simple predictive models. (4) Temperature requirements\nrange 0.7-5.0 with high variance, meaning compression ratio alone cannot\nreliably predict needed temperature without a validation set, partially refuting\nthe 'no validation set needed' claim. (5) Compression operation order (prune-\nthen-quantize vs quantize-then-prune) significantly affects calibration outcomes\n(differences up to 0.14 ECE), requiring careful attention during practical\ndeployment. (6) Fine-tuning fails as a calibration correction strategy,\nsometimes degrading calibration further, making temperature refitting the clear\nwinner for post-compression calibration."], "exec_time": [259.17487239837646, 934.785923242569, 433.20764422416687, 204.85911083221436, 922.6068675518036, 37.63806653022766, 317.95387387275696, 328.18509578704834, 657.8798696994781], "exec_time_feedback": ["", "", "", "", "", "", "", "", ""], "datasets_successfully_tested": [["MNIST", "Fashion_MNIST", "Adult_income"], [], [], ["MNIST", "Fashion-MNIST", "adult_income"], ["MNIST"], [], [], ["MNIST", "Fashion-MNIST", "Adult Income"], ["mnist", "fashion_mnist", "adult_income"]], "plot_code": ["import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\nos.makedirs(working_dir, exist_ok=True)\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\ndataset_keys = list(experiment_data.keys())\n\n# Per-dataset plots\nfor key in dataset_keys:\n    data = experiment_data[key]\n\n    try:\n        train_loss = data[\"losses\"][\"train\"]\n        val_loss = data[\"losses\"][\"val\"]\n        epochs = [d[\"epoch\"] for d in train_loss]\n        plt.figure()\n        plt.plot(epochs, [d[\"loss\"] for d in train_loss lt.figure()\n        plt.imshow(cm, cmap=\"Blues\")\n        plt.colorbar()\n        plt.xlabel(\"Predicted label\")\n        plt.ylabel(\"True label\")\n        plt.title(\n            f\"{key}: Confusion Matrix (Test Set)\\nBaseline Model, Original Temperature\"\n        )\n        plt.savefig(os.path.join(working_dir, f\"{key}_confusion_matrix.png\"))\n        plt.close()\n        test_acc = (preds == gt).mean()\n        print(f\"{key} baseline test accuracy from saved predictions: {test_acc:.4f}\")\n    except Exception as e:\n        print(f\"Error creating confusion matrix for {key}: {e}\")\n        plt.close()\n\n# Cross-dataset comparison plots\ntry:\n    colors_list = [\"tab:blue\", \"tab:orange\", \"tab:green\", \"tab:red\"]\n    crr_means = []\n    for key in dataset_keys:\n        vals = [\n            r[\"calibration_recovery_ratio\"]\n            for r in experiment_data[key][\"compression_results\"]\n            if not np.isnan(r[\"calibration_recovery_ratio\"])\n        ]\n        crr_means.append(np.mean(vals) if vals else np.nan)\n    plt.figure()\n    plt.bar(dataset_keys, crr_means, color=colors_list[: len(dataset_keys)])\n    plt.axhline(1.0, color=\"gray\", linestyle=\"--\", label=\"Full recovery\")\n    plt.ylabel(\"Mean calibration_recovery_ratio\")\n    plt.title(\n        \"Temperature Refit Recovery of Compression-Induced Miscalibration\\nComparison across all datasets\"\n    )\n    plt.legend()\n    plt.savefig(\n        os.path.join(working_dir, \"all_datasets_calibration_recovery_ratio.png\")\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating cross-dataset CRR plot: {e}\")\n    plt.close()\n\ntry:\n    colors = dict(zip(dataset_keys, [\"tab:blue\", \"tab:orange\", \"tab:green\", \"tab:red\"]))\n    plt.figure()\n    for key in dataset_keys:\n        comp = experiment_data[key][\"compression_results\"]\n        ratios = [r[\"compression_ratio\"] for r in comp]\n        temps = [r[\"temperature\"] for r in comp]\n        plt.scatter(ratios, temps, label=key, color=colors[key], alpha=0.7)\n    plt.xlabel(\"Compression ratio (bits/32 * (1-sparsity))\")\n    plt.ylabel(\"Optimal temperature\")\n    plt.title(\n        \"Optimal Temperature vs Compression Ratio\\nComparison across all datasets\"\n    )\n    plt.legend()\n    plt.savefig(\n        os.path.join(working_dir, \"all_datasets_temperature_vs_compression_ratio.png\")\n    )\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating cross-dataset temperature plot: {e}\")\n    plt.close()\n\ntry:\n    plt.figure()\n    for key in dataset_keys:\n        r2 = experiment_data[key][\"temp_regression_r2\"]\n        plt.bar(key, r2, color=colors.get(key, \"tab:gray\"))\n    plt.ylabel(\"R^2 (Temperature ~ compression_ratio)\")\n    plt.title(\n        \"Linear Fit Quality: Temperature vs Compression Ratio\\nComparison across all datasets\"\n    )\n    plt.savefig(os.path.join(working_dir, \"all_datasets_temp_regression_r2.png\"))\n    plt.close()\nexcept Exception as e:\n    print(f\"Error creating R^2 comparison plot: {e}\")\n    plt.close()\n", null, null, "import matplotlib.pyplot as plt\nimport numpy as np\nimport os\n\nworking_dir = os.path.join(os.getcwd(), \"working\")\n\ntry:\n    experiment_data = np.load(\n        os.path.join(working_dir, \"experiment_data.npy\"), allow_pickle=True\n    ).item()\nexcept Exception as e:\n    print(f\"Error loading experiment data: {e}\")\n    experiment_data = {}\n\nORDERS = list(experiment_data.keys())\nDATASET_KEYS = list(experiment_data[ORDERS[0]].keys()) if ORDERS else []\norder_for_curves = ORDERS[0] if ORDERS else None\n\n# 1) Loss curves (train/val) per dataset\ntry:\n    fig, axes = plt.subplots(1, len(DATASET_KEYS), figsize=(5 * len(DATASET_KEYS), 4))\n    if len(DATASET_KEYS) == 1:\n        axes = [axes]\n    for ax, key in zip(axes, DATASET_KEYS):\n        entry = experiment_data[order_for_curves][key]\n        tr = entry[\"losses\"][\"train\"]\n        va = ent
